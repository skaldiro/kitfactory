<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--mist); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 520px; height: 288px; }
  .flare { fill: var(--flare); }
  .ink { fill: var(--ink); }
  .card { fill: var(--card); }
  .rib { fill: var(--mist); }
  .rib-cut { fill: var(--flare); }
  .blk { rx: var(--radius-card); }
  .pill { rx: var(--radius-tag); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 100px; line-height: .9; font-weight: 900; font-stretch: 62.5%; letter-spacing: -0.01em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 520 288" width="520" height="288">
<!--
  blocks      flare 136x246 bled off the top (Scout, the identity hue, largest) · card 112x128 (relief) · ink 224x176 bled off the right edge (the case) · bottoms on one line, space-16 gutters
  arrangement one tall flare slab with two satellites, the ink slab reading as the case body
  pattern     the logo's ribs, from "Logo A, the Case: four ribs": space-4-wide pills at a space-6 pitch cut into the ink slab in mist, two short flare ribs on the card
  scales      gutters space-4; rib width space-4, pitch space-6; block corners radius-card; rib rx radius-tag (half of space-4)
-->
<rect class="flare blk" x="16" y="-22" width="136" height="246" rx="22"/>
<rect class="card blk" x="168" y="96" width="112" height="128" rx="22"/>
<rect class="ink blk" x="296" y="48" width="240" height="176" rx="22"/>
<rect class="rib pill" x="328" y="80" width="16" height="112" rx="8"/>
<rect class="rib pill" x="352" y="80" width="16" height="112" rx="8"/>
<rect class="rib pill" x="376" y="80" width="16" height="112" rx="8"/>
<rect class="rib pill" x="400" y="80" width="16" height="112" rx="8"/>
<rect class="rib-cut pill" x="200" y="128" width="16" height="64" rx="8"/>
<rect class="rib-cut pill" x="232" y="152" width="16" height="40" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">kitmunk</h1>
<p class="tag">Packing for the whole crew, minus the thinking.</p>
</div>
</div>
</body>
</html>
