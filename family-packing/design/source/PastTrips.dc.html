<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Past and archived trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="Trips.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font: 500 11px 'DM Mono', monospace; letter-spacing: 0.1em; color: #56665F">ALL TRIPS</span>
<span style="width: 44px; height: 44px"></span>
</header>

<h1 style="flex: none; margin: 0 4px; font-size: 52px; line-height: 0.9; font-weight: 900; font-stretch: 64%; letter-spacing: -0.01em">Where you've been</h1>

<div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 13px; background: #E2E8DF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; font: {{t.w}} 14px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px">
<sc-for list="{{trips}}" as="p" hint-placeholder-count="3">
<article style="flex: none; background: #FFFFFF; border-radius: 20px; padding: 14px 14px 12px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">{{p.when}}</span>
<span style="font-size: 30px; line-height: 0.95; font-weight: 900; font-stretch: 64%">{{p.name}}</span>
<span style="font-size: 13px; color: #56665F">{{p.meta}}</span>
</div>
<span style="display: flex; padding-top: 4px">
<sc-for list="{{p.crew}}" as="c" hint-placeholder-count="4"><span style="width: 22px; height: 22px; margin-left: -6px; border-radius: 50%; background: {{c}}; border: 2px solid #FFFFFF"></span></sc-for>
</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{p.past}}" hint-placeholder-val="{{ true }}">
<a href="Repeat.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: #0E2A23; color: #EEF1EA; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>Pack like this</a>
<a href="Reveal.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: #EEF1EA; display: inline-flex; align-items: center; font-size: 14px; font-weight: 650">View list</a>
<span style="flex: 1"></span>
<button type="button" onClick="{{p.archive}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; font: 650 13px Archivo, system-ui, sans-serif; color: #56665F; cursor: pointer">Archive</button>
</sc-if>
<sc-if value="{{p.archived}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{p.restore}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #0E2A23; color: #EEF1EA; font: 700 14px Archivo, system-ui, sans-serif; cursor: pointer">Restore</button>
<span style="flex: 1"></span>
<button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; font: 650 13px Archivo, system-ui, sans-serif; color: #B23A0B; cursor: pointer">Delete for good</button>
</sc-if>
</div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; padding: 24px 20px; border-radius: 20px; border: 1.5px dashed #B7C2BB; text-align: center; font-size: 14px; line-height: 1.45; color: #56665F">{{emptyText}}</div>
</sc-if>
<p style="flex: none; margin: 4px 4px 0; font-size: 12px; line-height: 1.4; color: #56665F">Archiving hides a trip from home. Scout keeps what it learned about your family either way.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KB_ALL = [
  { id: 'tahoe', name: 'Tahoe, summer', when: 'AUG 2026 · 5 DAYS', meta: 'Lake week · cabin · driving · 78 items', crew: ['#3A6BFF', '#7BE0B5', '#FFC94A', '#FF9BAE'], archived: false },
  { id: 'lisbon', name: 'Lisbon', when: 'MAR 2026 · 7 DAYS', meta: 'City week · apartment · flying · 96 items', crew: ['#3A6BFF', '#7BE0B5', '#FFC94A', '#FF9BAE'], archived: false },
  { id: 'sac', name: "Grandma's, Sacramento", when: 'DEC 2025 · WEEKEND', meta: 'Family visit · driving · 41 items', crew: ['#3A6BFF', '#FFC94A', '#FF9BAE'], archived: false },
  { id: 'pdx', name: 'Portland long weekend', when: 'OCT 2026 · NEVER PACKED', meta: 'Archived Oct 14 · 52 items', crew: ['#3A6BFF', '#7BE0B5'], archived: true }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const arch = {};
    KB_ALL.forEach((t) => { arch[t.id] = t.archived; });
    this.state = { tab: 'past', arch };
  }
  renderVals() {
    const s = this.state;
    const isArch = s.tab === 'archived';
    const nPast = KB_ALL.filter((t) => !s.arch[t.id]).length;
    const nArch = KB_ALL.length - nPast;
    const set = (id, v) => this.setState({ arch: { ...s.arch, [id]: v } });
    const trips = KB_ALL.filter((t) => !!s.arch[t.id] === isArch).map((t) => ({
      name: t.name, when: t.when, meta: t.meta, crew: t.crew,
      past: !isArch, archived: isArch,
      archive: () => set(t.id, true), restore: () => set(t.id, false)
    }));
    const tab = (id, label, n) => { const on = s.tab === id; return { label: label + ' · ' + n, bg: on ? '#FFFFFF' : 'transparent', w: on ? '750' : '550', pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: id }) }; };
    return {
      tabs: [tab('past', 'Past', nPast), tab('archived', 'Archived', nArch)],
      trips,
      empty: trips.length === 0,
      emptyText: isArch ? 'Nothing archived. Trips you archive land here and can be restored any time.' : 'No past trips yet. Finished trips show up here so you can pack like them again.'
    };
  }
}
</script>
</body>
</html>
