<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Add an item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#56665F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF"></span><span style="font-size: 28px; font-weight: 900; font-stretch: 62.5%">Italy</span></div>
<div style="height: 120px; border-radius: 22px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Add an item" style="position: absolute; left: 0; right: 0; top: 150px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D9DFD6"></span>

<div style="display: flex; align-items: center; gap: 12px">
<h1 style="flex: 1; margin: 0; font-size: 28px; line-height: 1; font-weight: 900; font-stretch: 62.5%">Add to the list</h1>
<a href="Pack.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="height: 56px; box-sizing: border-box; border: 1.5px solid #0E2A23; border-radius: 14px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 4px">
<input aria-label="What to add" value="{{text}}" onChange="{{onText}}" placeholder="2 binoculars for Leo" style="flex: 1; min-width: 0; border: 0; padding: 0; outline: none; background: transparent; font: 500 16px Archivo, system-ui, sans-serif; color: #0E2A23">
<a href="VoiceRecord.dc.html" aria-label="Say it instead" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
</div>

<div style="border: 1.5px dashed #FF5B23; background: #FFF9F6; border-radius: 22px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B23A0B"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.6" fill="#0E2A23"></circle></svg>Scout read it as</span>
<span style="font-size: 20px; line-height: 1.2; font-weight: 700">{{itemName}}</span>
<span style="font-size: 14px; color: #56665F">{{meta}}</span>
</span>
<div style="display: flex; align-items: center; border-radius: 14px; background: #FFFFFF">
<button type="button" onClick="{{qtyDown}}" aria-label="One fewer" style="width: 44px; height: 44px; border: 0; background: transparent; font: 600 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">−</button>
<span style="min-width: 24px; text-align: center; font-size: 16px; font-weight: 700">{{qty}}</span>
<button type="button" onClick="{{qtyUp}}" aria-label="One more" style="width: 44px; height: 44px; border: 0; background: transparent; font: 600 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">+</button>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">For</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{people}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; padding: 0 14px 0 10px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: 600 14px Archivo, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span>{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="width: 100%; padding: 0; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F"><span>Bag</span><span style="font-weight: 500; letter-spacing: 0; text-transform: none">Optional</span></legend>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{bags}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; flex: none; padding: 0 14px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: 600 14px Archivo, system-ui, sans-serif; white-space: nowrap; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Shopping</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #EEF1EA">
<sc-for list="{{statuses}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; border: 0; border-radius: 10px; background: {{o.bg}}; color: #0E2A23; font: {{o.w}} 14px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<a href="Pack.dc.html" style="margin-top: auto; height: 56px; border-radius: 14px; background: #0E2A23; color: #EEF1EA; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{cta}}</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KB_PEOPLE = [['nadia', 'Nadia', '#AFC6FF'], ['sam', 'Sam', '#7BE0B5'], ['leo', 'Leo', '#FFC94A'], ['ivy', 'Ivy', '#FF9BAE'], ['shared', 'Shared', '#0E2A23']];
const KM_BAGS = [['none', 'No bag yet'], ['chk', 'Checked case'], ['co', 'Carry-on'], ['leo', "Leo's backpack"], ['day', 'Day bag']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: '2 binoculars for Leo', who: null, qty: null, status: 'have', bag: 'none' };
  }
  parse(t) {
    const s = t.toLowerCase();
    let who = null;
    KB_PEOPLE.forEach((p) => { if (new RegExp('\\b' + p[1].toLowerCase() + '\\b').test(s)) who = p[0]; });
    if (/\b(everyone|all of us|shared)\b/.test(s)) who = 'shared';
    const m = s.match(/(?:x|×)\s*(\d+)|\b(\d+)\b/);
    const qty = m ? Math.max(1, Math.min(99, parseInt(m[1] || m[2], 10))) : null;
    let name = t.replace(/\bfor\s+[\w']+/i, '').replace(/(?:x|×)\s*\d+|\b\d+\b/i, '').replace(/\s+/g, ' ').trim();
    name = name ? name.charAt(0).toUpperCase() + name.slice(1) : '';
    let cat = 'Other';
    if (/binocular|book|game|toy|ball|camera|sketch|puzzle/.test(s)) cat = 'Activities';
    else if (/shirt|sock|jacket|hat|shoe|pants|sweater|coat|umbrella/.test(s)) cat = 'Clothing';
    else if (/toothbrush|sunscreen|shampoo|soap|lotion/.test(s)) cat = 'Toiletries';
    else if (/charger|passport|snack|adapter|bottle/.test(s)) cat = 'Travel-day essentials';
    return { who, qty, name, cat };
  }
  renderVals() {
    const s = this.state;
    const p = this.parse(s.text);
    const who = s.who || p.who || 'shared';
    const qty = s.qty || p.qty || 1;
    const person = KB_PEOPLE.find((x) => x[0] === who);
    const people = KB_PEOPLE.map((x) => {
      const on = x[0] === who;
      return { label: x[1], dot: on && x[0] === 'shared' ? '#EEF1EA' : x[2], pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#7D8B85', pick: () => this.setState({ who: x[0] }) };
    });
    const statuses = [['have', 'Have it'], ['need', 'To buy']].map((o) => {
      const on = s.status === o[0];
      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', w: on ? '700' : '500', pick: () => this.setState({ status: o[0] }) };
    });
    const bags = KM_BAGS.map((o) => {
      const on = s.bag === o[0];
      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#7D8B85', pick: () => this.setState({ bag: o[0] }) };
    });
    const owner = who === 'shared' ? 'the shared list' : person[1] + "'s list";
    return {
      text: s.text,
      onText: (e) => this.setState({ text: e.target.value, who: null, qty: null }),
      itemName: p.name || 'Name your item',
      meta: p.cat,
      qty,
      qtyUp: () => this.setState({ qty: Math.min(99, qty + 1) }),
      qtyDown: () => this.setState({ qty: Math.max(1, qty - 1) }),
      people, statuses, bags,
      cta: 'Add to ' + owner
    };
  }
}
</script>
</body>
</html>
