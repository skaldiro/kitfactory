<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · All packed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0E2A23}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; padding: 12px 16px 22px; display: flex; flex-direction: column; overflow: hidden; background: #0E2A23; color: #EEF1EA; font-family: Archivo, system-ui, sans-serif">
<svg width="390" height="844" viewBox="0 0 390 844" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g stroke="#1F443A" stroke-width="1.25" transform="translate(300 170)">
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(.6)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(1.3)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(2.1)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(3)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(4)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(5.2)" vector-effect="non-scaling-stroke"/>
</g>
</svg>

<div style="position: relative; flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between">
<a href="Reveal.dc.html" aria-label="Trip home" style="width: 44px; height: 44px; border-radius: 22px; background: #163A31; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font: 500 11px 'DM Mono', monospace; letter-spacing: 0.1em; color: #9FB5AC">ITALY · NOV 20–29</span>
<span style="width: 44px; height: 44px"></span>
</div>

<div style="position: relative; flex: none; margin-top: 22px; padding: 0 4px">
<span style="display: block; font-size: 148px; line-height: 0.8; font-weight: 900; font-stretch: 62%; letter-spacing: -0.02em; color: #FF5B23">100%</span>
<h1 style="margin: 14px 0 0; font-size: 46px; line-height: 0.92; font-weight: 900; font-stretch: 64%; letter-spacing: -0.01em">Everything's packed.</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: #B6C8C0">160 of 160, across 4 people and 4 bags.</p>
</div>

<div style="position: relative; flex: none; margin-top: 18px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{crew}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="{{c.fill}}" stroke-width="4"/><circle cx="26" cy="26" r="16.5" fill="{{c.fill}}"/><path d="M19 26.5l5 5 9-10" fill="none" stroke="{{c.ink}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-size: 12px; font-weight: 700">{{c.name}}</span>
</div>
</sc-for>
</div>

<section style="position: relative; flex: none; margin-top: 20px; background: #FFFFFF; color: #0E2A23; border-radius: 22px; padding: 14px 8px 8px 8px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #B23A0B"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.6" fill="#0E2A23"/></svg>BEFORE YOU LOCK THE DOOR</span>
<span style="font: 500 11px 'DM Mono', monospace; color: #56665F">{{doorCount}}</span>
</div>
<sc-for list="{{door}}" as="d" hint-placeholder-count="4">
<button type="button" onClick="{{d.toggle}}" aria-pressed="{{d.pressed}}" style="height: 48px; padding: 0 8px; border: 0; border-top: 1px solid #EDF0EA; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; font-family: Archivo, system-ui, sans-serif">
<span style="width: 28px; height: 28px; flex: none; box-sizing: border-box; border-radius: 9px; border: 2px solid {{d.bd}}; background: {{d.bg}}; display: grid; place-items: center"><sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
<span style="flex: 1; font-size: 16px; font-weight: 650; color: {{d.color}}; text-decoration: {{d.strike}}">{{d.label}}</span>
</button>
</sc-for>
</section>

<a href="Trips.dc.html" style="position: relative; flex: none; margin-top: auto; height: 60px; border-radius: 20px; background: #FF5B23; color: #0E2A23; display: flex; align-items: center; justify-content: space-between; padding: 0 9px 0 22px; font-size: 19px; font-weight: 750">Have a great trip<span style="width: 44px; height: 44px; border-radius: 14px; background: #0E2A23; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { 0: true } };
  }
  renderVals() {
    const s = this.state;
    const labels = ['Passports are in the day bag', 'Chargers unplugged and packed', 'Stroller is by the door', 'The bunny. Obviously.'];
    const door = labels.map((label, i) => {
      const on = !!s.on[i];
      return { label, on, pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', bd: on ? '#0E2A23' : '#B7C2BB', color: on ? '#56665F' : '#0E2A23', strike: on ? 'line-through' : 'none', toggle: () => this.setState({ on: { ...s.on, [i]: !on } }) };
    });
    return {
      door,
      doorCount: door.filter((d) => d.on).length + ' OF ' + door.length,
      crew: [['Nadia', '#3A6BFF', '#FFFFFF'], ['Sam', '#7BE0B5', '#0E2A23'], ['Leo', '#FFC94A', '#0E2A23'], ['Ivy', '#FF9BAE', '#0E2A23'], ['Shared', '#EEF1EA', '#0E2A23']].map((c) => ({ name: c[0], fill: c[1], ink: c[2] }))
    };
  }
}
</script>
</body>
</html>
