<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Voice, transcribing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E2A23}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
@keyframes kmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes kmSweep{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; padding: 16px 16px 28px; display: flex; flex-direction: column; overflow: hidden; background: #0E2A23; color: #EEF1EA; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9FB5AC">{{label}}</span>
</header>

<div style="flex: none; margin-top: 32px; padding: 0 4px; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 40px; line-height: 0.95; font-weight: 900; font-stretch: 62.5%">{{headline}}</h1>
</div>

<p style="flex: none; margin: 24px 4px 0; font-size: 20px; line-height: 1.4; font-weight: 500; color: #9FB5AC">“Italy for ten days, Rome then Florence then the coast. Two of us and the kids, Leo is six and Ivy is three, the apartment in Florence has a washer.”</p>

<div style="flex: 1; display: grid; place-items: center">
<div aria-hidden="true" style="width: 96px; height: 96px; display: grid; place-items: center; animation: kmPulse 1.6s ease-in-out infinite">
<svg width="96" height="96" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.2" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.4" fill="#0E2A23"></circle></svg>
</div>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="position: relative; height: 4px; border-radius: 999px; background: #21463B; overflow: hidden">
<span style="position: absolute; top: 0; left: -40%; width: 40%; height: 4px; border-radius: 999px; background: #FF5B23; animation: kmSweep 1.4s ease-in-out infinite"></span>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="Describe.dc.html" style="height: 56px; border-radius: 14px; background: #EEF1EA; color: #0E2A23; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Check what Scout filled in</a>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
<a href="VoiceRecord.dc.html" style="height: 44px; display: grid; place-items: center; color: #EEF1EA; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Record again</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: false };
  }
  componentDidMount() {
    if (this.props.autoplay === false) return;
    this._t = setTimeout(() => this.setState({ done: true }), 2600);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const d = this.state.done;
    return {
      done: d, working: !d,
      label: d ? 'Done' : 'Transcribing',
      headline: d ? 'Got it. Here is what I heard.' : 'Writing it down…'
    };
  }
}
</script>
</body>
</html>
