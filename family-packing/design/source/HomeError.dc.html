<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Could not load trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
@keyframes kbSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; padding: 0 0 0 4px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 11V8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" fill="none" stroke="#FF5B23" stroke-width="3.5" stroke-linecap="round"/><rect x="7" y="11" width="34" height="30" rx="7" fill="#FF5B23"/><rect x="12" y="17" width="4" height="18" rx="2" fill="#0E2A23"/><rect x="18.7" y="17" width="4" height="18" rx="2" fill="#0E2A23"/><rect x="25.3" y="17" width="4" height="18" rx="2" fill="#0E2A23"/><rect x="32" y="17" width="4" height="18" rx="2" fill="#0E2A23"/><circle cx="15" cy="44" r="2.2" fill="#FF5B23"/><circle cx="33" cy="44" r="2.2" fill="#FF5B23"/></svg>
<span style="font-size: 26px; font-weight: 850; font-stretch: 72%; letter-spacing: -0.01em">kitbag</span>
</div>
<a href="Account.dc.html" aria-label="Account and settings" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4.5 4.2-7 8-7s7 2.5 8 7"/></svg></a>
</header>

<h1 style="flex: none; margin: 16px 4px 0; font-size: 56px; line-height: 0.9; font-weight: 900; font-stretch: 64%; letter-spacing: -0.01em">Where to next?</h1>

<section role="alert" style="flex: none; margin-top: 18px; background: #FFFFFF; border: 1.5px dashed #FF5B23; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #B23A0B">CAN'T REACH KITBAG RIGHT NOW</span>
<h2 style="margin: 0; font-size: 30px; line-height: 0.95; font-weight: 900; font-stretch: 66%">Your trips didn't load.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #56665F">Your lists are safe. This is a connection problem, not a lost trip.</p>
<button type="button" onClick="{{retry}}" style="align-self: flex-start; margin-top: 4px; height: 52px; padding: 0 20px; border: 0; border-radius: 16px; background: #0E2A23; color: #EEF1EA; font: 750 16px Archivo, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: {{spin}}"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>{{retryLabel}}</button>
</section>

<span style="flex: none; margin: 22px 4px 0; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.1em; color: #56665F">SAVED ON THIS PHONE</span>
<a href="Reveal.dc.html" style="flex: none; margin-top: 8px; border-radius: 22px; background: #0E2A23; color: #EEF1EA; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #9FB5AC">NOV 20–29 · LAST UPDATED 2 MIN AGO</span>
<span style="font-size: 52px; line-height: 0.88; font-weight: 900; font-stretch: 62%">Italy</span>
<span style="font-size: 13px; color: #B6C8C0">74 of 160 packed when we last checked</span>
</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</a>

<a href="Describe.dc.html" style="flex: none; margin-top: auto; height: 58px; border-radius: 18px; border: 1.5px solid #0E2A23; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Start a new trip anyway</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { busy: false };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const busy = this.state.busy;
    return {
      retry: () => { if (busy) return; this.setState({ busy: true }); this._t = setTimeout(() => this.setState({ busy: false }), 1600); },
      retryLabel: busy ? 'Trying again…' : 'Try again',
      spin: busy ? 'kbSpin 0.9s linear infinite' : 'none'
    };
  }
}
</script>
</body>
</html>
