<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · By bag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="position: absolute; left: 16px; right: 16px; top: 12px; height: 48px; display: flex; align-items: center; gap: 10px">
<a href="Pack.dc.html" aria-label="Back to packing" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 28px; line-height: 1; font-weight: 900; font-stretch: 62.5%">Bags</span>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Italy · 4 bags</span>
</div>
<a href="BagSheet.dc.html" style="height: 44px; padding: 0 8px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Edit bags</a>
</header>

<div style="position: absolute; left: 0; right: 0; top: 76px; bottom: 0; overflow-y: auto; padding: 0 16px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{showScout}}" hint-placeholder-val="{{ true }}">
<section style="flex: none; border: 1.5px dashed #FF5B23; background: #FFF9F6; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B23A0B"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.6" fill="#0E2A23"></circle></svg>Scout</span>
<span style="font-size: 16px; line-height: 1.3; font-weight: 700">{{sortTitle}}</span>
<span style="font-size: 14px; line-height: 1.4; color: #56665F">{{sortBody}}</span>
<sc-if value="{{sortIdle}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{preview}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: #FF5B23; color: #0E2A23; font: 700 14px Archivo, system-ui, sans-serif; cursor: pointer">Sort them for me</button>
<button type="button" onClick="{{skip}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #0E2A23; font: 600 14px Archivo, system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">I'll do it myself</button>
</div>
</sc-if>
<sc-if value="{{sortPreview}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="height: 28px; padding: 0 10px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600">+30 Checked case</span>
<span style="height: 28px; padding: 0 10px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600">+9 Carry-on</span>
<span style="height: 28px; padding: 0 10px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600">+5 Day bag</span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{apply}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: #0E2A23; color: #EEF1EA; font: 700 14px Archivo, system-ui, sans-serif; cursor: pointer">Apply</button>
<button type="button" onClick="{{cancel}}" style="height: 44px; padding: 0 16px; box-sizing: border-box; border: 1.5px solid #7D8B85; border-radius: 14px; background: #FFFFFF; color: #0E2A23; font: 700 14px Archivo, system-ui, sans-serif; cursor: pointer">Not now</button>
</div>
</sc-if>
<sc-if value="{{sortDone}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{cancel}}" style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; color: #0E2A23; font: 600 14px Archivo, system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Undo</button>
</sc-if>
</section>
</sc-if>

<sc-for list="{{bags}}" as="b" hint-placeholder-count="4">
<section style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{b.toggle}}" aria-expanded="{{b.expanded}}" style="display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-family: Archivo, system-ui, sans-serif; color: #0E2A23">
<span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: #EEF1EA; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">{{b.name}}</span>
<span style="font-size: 12px; color: #56665F">{{b.who}}</span>
</span>
<span style="font-size: 14px; font-weight: 600; color: #56665F">{{b.count}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{b.rot}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div aria-hidden="true" style="height: 6px; display: flex; gap: 2px">
<sc-for list="{{b.mix}}" as="m" hint-placeholder-count="4"><span style="flex: {{m.n}} 1 0; border-radius: 999px; background: {{m.c}}"></span></sc-for>
</div>
<sc-if value="{{b.open}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{b.rows}}" as="r" hint-placeholder-count="4">
<div style="min-height: 44px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #EDF0EA">
<span style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 999px; border: 2px solid {{r.ring}}; background: {{r.dot}}; display: grid; place-items: center"><sc-if value="{{r.packed}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 500; color: {{r.nameColor}}">{{r.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #56665F"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{r.fill}}"></span>{{r.owner}}</span>
</div>
</sc-for>
<sc-if value="{{b.hasNote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 4px 0 0; padding: 10px 12px; border-radius: 14px; background: #EEF1EA; font-size: 14px; line-height: 1.4">{{b.note}}</p>
</sc-if>
<span style="margin-top: 8px; font-size: 12px; font-weight: 600; color: #56665F">{{b.more}}</span>
</div>
</sc-if>
</section>
</sc-for>

<section style="flex: none; border: 1.5px solid #D9DFD6; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: #EEF1EA; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">No bag yet</span><span style="font-size: 12px; color: #56665F">{{unSub}}</span></span>
<span style="font-size: 14px; font-weight: 600; color: #56665F">{{unCount}}</span>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KB_CASE = 'M4 8h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8zM9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3M8 12v5M16 12v5';
const KB_PACK = 'M7 9a5 5 0 0 1 10 0v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9zM10 4.5V3h4v1.5M9.5 14h5v3h-5z';
const KB_OWN = { N: ['#AFC6FF', 'Nadia'], S: ['#7BE0B5', 'Sam'], L: ['#FFC94A', 'Leo'], I: ['#FF9BAE', 'Ivy'], U: ['#0E2A23', 'Shared'] };
const KB_BAGLIST = [
  { id: 'chk', name: 'Checked case', who: 'Goes under the plane', items: 64, packed: 44, add: 30, icon: KB_CASE,
    mix: [['#AFC6FF', 14], ['#7BE0B5', 12], ['#FFC94A', 16], ['#FF9BAE', 18], ['#0E2A23', 4]],
    rows: [['T-shirts ×5', 'I', true, ''], ['Pajamas ×3', 'L', true, ''], ['Laundry pods ×6', 'U', true, ''], ['Pajamas', 'N', false, '']] },
  { id: 'co', name: 'Carry-on', who: 'Sam carries it', items: 22, packed: 14, add: 9, icon: KB_CASE,
    mix: [['#7BE0B5', 8], ['#AFC6FF', 5], ['#FF9BAE', 5], ['#0E2A23', 4]],
    rows: [['Camera + spare battery', 'S', false, ''], ['First-aid kit', 'U', true, ''], ['Light cardigan', 'I', false, ''], ['Favorite blanket', 'I', true, '']] },
  { id: 'leo', name: "Leo's backpack", who: 'Leo carries it', items: 9, packed: 2, add: 0, icon: KB_PACK,
    mix: [['#FFC94A', 8], ['#FF9BAE', 1]],
    note: "Ivy's bunny rides in Leo's backpack. It still counts toward Ivy's list.",
    rows: [['Headlamp', 'L', true, ''], ['Sketchbook & pencils', 'L', false, ''], ['Tablet + headphones', 'L', false, ''], ['Bunny (the one)', 'I', false, '']] },
  { id: 'day', name: 'Day bag', who: 'Nadia carries it', items: 21, packed: 14, add: 5, icon: KB_PACK,
    mix: [['#AFC6FF', 7], ['#0E2A23', 9], ['#FFC94A', 3], ['#FF9BAE', 2]],
    rows: [['Passports ×4', 'U', true, ''], ['Snacks for the flight', 'N', false, ' · to buy'], ['Wet wipes ×3', 'U', true, ''], ['Sun hat', 'I', false, ' · to buy']] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'leo', sort: 'idle' };
  }
  renderVals() {
    const { open, sort } = this.state;
    const done = sort === 'done';
    const bags = KB_BAGLIST.map((b) => {
      const isOpen = open === b.id;
      const items = b.items + (done ? b.add : 0);
      const mix = b.mix.map((m) => ({ c: m[0], n: m[1] }));
      if (done && b.add) mix.push({ c: '#D9DFD6', n: b.add });
      return {
        name: b.name, icon: b.icon, count: b.packed + ' of ' + items,
        who: b.who,
        open: isOpen, expanded: isOpen ? 'true' : 'false', rot: isOpen ? 'rotate(180deg)' : 'none',
        toggle: () => this.setState({ open: isOpen ? null : b.id }),
        mix,
        hasNote: !!b.note, note: b.note || '',
        more: (items - b.rows.length) + ' more in this bag',
        rows: b.rows.map((r) => {
          const o = KB_OWN[r[1]];
          return { name: r[0], packed: r[2], ring: r[2] ? '#0E2A23' : '#7D8B85', dot: r[2] ? '#0E2A23' : '#FFFFFF', nameColor: r[2] ? '#56665F' : '#0E2A23', fill: o[0], owner: (r[1] === 'U' ? 'Shared' : o[1] + "'s") + r[3] };
        })
      };
    });
    return {
      bags,
      sortIdle: sort === 'idle', sortPreview: sort === 'preview', sortDone: done,
      sortTitle: done ? 'Sorted. Every item has a bag.' : (sort === 'preview' ? 'Here is my plan. Nothing moves until you apply.' : "44 items aren't in a bag yet."),
      sortBody: done ? 'Night things went in the checked case and plane things in the carry-on.' : 'I can sort them by who carries what and what you need on the plane.',
      preview: () => this.setState({ sort: 'preview' }),
      apply: () => this.setState({ sort: 'done' }),
      cancel: () => this.setState({ sort: 'idle' }),
      showScout: sort !== 'skipped',
      skip: () => this.setState({ sort: 'skipped' }),
      unCount: done ? '0' : '44',
      unSub: done ? 'Everything has a home' : 'Open a bag or an item to choose'
    };
  }
}
</script>
</body>
</html>
