<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Trip menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="font-size: 30px; font-weight: 900; font-stretch: 64%">Italy</span></div>
<div style="height: 8px; border-radius: 4px; background: #D9DFD6"></div>
<div style="height: 110px; border-radius: 20px; background: #FFFFFF"></div>
<div style="height: 180px; border-radius: 20px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Trip menu" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 12px 22px; box-sizing: border-box; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9DFD6"></span>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">NOV 20–29 · ROME, FLORENCE, CINQUE TERRE</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 900; font-stretch: 66%">Italy</h1>
</div>
<a href="Pack.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<a href="Review.dc.html" style="height: 56px; padding: 0 8px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">Edit trip details</span><span style="font-size: 13px; color: #56665F">Dates, stops, crew</span></a>
<a href="Bags.dc.html" style="height: 56px; padding: 0 8px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8zM9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">Bags</span><span style="font-size: 13px; color: #56665F">4 bags · 44 loose</span></a>
<a href="Share.dc.html" style="height: 56px; padding: 0 8px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20c.8-4 3.5-6 7-6s6.2 2 7 6M16 11a3 3 0 1 0 0-6M18 14c2.2.6 3.6 2.6 4 6"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">Pack together</span><span style="font-size: 13px; color: #56665F">Invite someone</span></a>
<a href="Repeat.dc.html" style="height: 56px; padding: 0 8px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">New trip from this one</span><span style="font-size: 13px; color: #56665F">Duplicate</span></a>

<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{askArchive}}" style="height: 56px; padding: 0 8px; border: 0; border-top: 1px solid #EDF0EA; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; font-family: Archivo, system-ui, sans-serif; color: #0E2A23"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v4H4zM6 10v9h12v-9M10 14h4"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">Archive trip</span></button>
<button type="button" onClick="{{askDelete}}" style="height: 56px; padding: 0 8px; border: 0; border-top: 1px solid #EDF0EA; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; font-family: Archivo, system-ui, sans-serif; color: #B23A0B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B23A0B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span style="flex: 1; font-size: 16px; font-weight: 650">Delete trip</span></button>
</sc-if>

<sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
<div style="margin: 8px 4px 0; padding: 14px; border-radius: 18px; background: #EEF1EA; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 750">{{confirmTitle}}</span>
<span style="font-size: 14px; line-height: 1.4; color: #56665F">{{confirmBody}}</span>
<div style="display: flex; gap: 8px">
<a href="Trips.dc.html" style="height: 48px; padding: 0 18px; border-radius: 14px; background: {{confirmBg}}; color: {{confirmFg}}; display: inline-flex; align-items: center; font-size: 15px; font-weight: 750">{{confirmLabel}}</a>
<button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 18px; border: 1.5px solid #D9DFD6; border-radius: 14px; background: #FFFFFF; color: #0E2A23; font: 650 15px Archivo, system-ui, sans-serif; cursor: pointer">Keep it</button>
</div>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ask: null };
  }
  renderVals() {
    const a = this.state.ask;
    const del = a === 'delete';
    return {
      idle: !a, confirming: !!a,
      askArchive: () => this.setState({ ask: 'archive' }),
      askDelete: () => this.setState({ ask: 'delete' }),
      cancel: () => this.setState({ ask: null }),
      confirmTitle: del ? 'Delete Italy for everyone?' : 'Archive Italy?',
      confirmBody: del ? 'The list and its 160 items are removed for the whole household. What Scout learned about your family stays.' : 'It moves to past trips and leaves your home screen. You can still pack like it later.',
      confirmLabel: del ? 'Delete trip' : 'Archive',
      confirmBg: del ? '#B23A0B' : '#0E2A23',
      confirmFg: del ? '#FFFFFF' : '#EEF1EA'
    };
  }
}
</script>
</body>
</html>
