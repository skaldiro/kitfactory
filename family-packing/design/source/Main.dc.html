<style>
body{margin:0;background:#0E2A23}
a{color:#0E2A23;text-decoration:none}

@keyframes kmRibS{0%,80%{transform:scaleY(.08)}86%,94%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
@keyframes kmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes kmReady{0%,84%{opacity:0;transform:translateY(6px)}88%,95%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<div style="position: absolute; left: 24px; right: 24px; top: 104px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 64px; line-height: 0.88; font-weight: 900; font-stretch: 62.5%; letter-spacing: -0.01em; color: #EEF1EA">Packing for the whole crew, <span style="color: #FF5B23">minus the thinking.</span></h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #B6C8C0">Tell Scout where you're going and who's coming. It makes everyone's list.</p>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 424px; width: 390px; height: 280px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<span style="--dx: {{c.dx}}px; --r: {{c.r}}deg; position: absolute; left: {{c.x}}px; top: {{c.y}}px; height: 40px; padding: 0 14px 0 10px; box-sizing: border-box; border-radius: 8px; background: {{c.bg}}; color: #0E2A23; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18); transform: rotate({{c.r}}deg); animation: kmDrop 8s cubic-bezier(.5,0,.2,1) {{c.delay}}s infinite both"><span style="width: 20px; height: 20px; border-radius: 50%; background: #0E2A23; color: {{c.bg}}; display: grid; place-items: center; font-size: 11px; font-weight: 700">{{c.who}}</span>{{c.label}}</span>
</sc-for>

<div style="position: absolute; left: 120px; top: 140px; width: 150px; height: 130px; animation: kmBob 4s ease-in-out infinite">
<span style="position: absolute; left: 50px; top: 0; width: 50px; height: 22px; box-sizing: border-box; border: 6px solid #FF5B23; border-bottom: 0; border-radius: 12px 12px 0 0"></span>
<div style="position: absolute; left: 0; top: 18px; width: 150px; height: 104px; border-radius: 22px; background: #FF5B23; display: flex; align-items: center; justify-content: center; gap: 11px; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25)">
<sc-for list="{{ribs}}" as="r" hint-placeholder-count="4">
<span style="width: 16px; height: 66px; border-radius: 8px; background: #0E2A23; overflow: hidden; display: flex; align-items: flex-end"><span style="width: 16px; height: 66px; border-radius: 8px; background: {{r.c}}; transform-origin: 50% 100%; animation: {{r.anim}} 8s cubic-bezier(.3,1.4,.5,1) infinite both"></span></span>
</sc-for>
</div>
<span style="position: absolute; left: 30px; top: 120px; width: 10px; height: 10px; border-radius: 50%; background: #FF5B23"></span>
<span style="position: absolute; left: 110px; top: 120px; width: 10px; height: 10px; border-radius: 50%; background: #FF5B23"></span>
</div>

<span style="position: absolute; left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; color: #EEF1EA; top: 100px; animation: kmReady 8s ease-out infinite both">4 lists, packed.</span>
</div>

<section style="position: absolute; left: 0; right: 0; bottom: 0; background: #EEF1EA; color: #0E2A23; border-radius: 22px 22px 0 0; padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<a href="Describe.dc.html" style="height: 56px; border-radius: 14px; background: #FF5B23; color: #0E2A23; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">Plan a trip<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<p style="margin: 0; font-size: 14px; color: #56665F; text-align: center">No account needed. Save it once you like it.</p>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      chips: [
        ['L', 'Swimsuits ×2', '#FFC94A', 24, 16, -4, 100, 0],
        ['I', 'The bunny. Obviously.', '#FF9BAE', 186, 52, 3, -88, 1.6],
        ['N', 'Hiking boots', '#AFC6FF', 40, 64, -3, 98, 3.2],

      ].map((c) => ({ who: c[0], label: c[1], bg: c[2], x: c[3], y: c[4], r: c[5], dx: c[6], delay: c[7] })),
      ribs: [['#AFC6FF', 'kmRibN'], ['#7BE0B5', 'kmRibS'], ['#FFC94A', 'kmRibL'], ['#FF9BAE', 'kmRibI']].map((r) => ({ c: r[0], anim: r[1] }))
    };
  }
}
</script>
