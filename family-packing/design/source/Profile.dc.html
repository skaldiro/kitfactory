<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Crew profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#7D8B85}
textarea::placeholder{color:#9FB5AC}
@keyframes kbBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="Crew.dc.html" aria-label="Back to crew" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font: 500 11px 'DM Mono', monospace; letter-spacing: 0.1em; color: #56665F">{{headLabel}}</span>
<a href="Crew.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #0E2A23; color: #EEF1EA; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700">Done</a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px">

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 64px; height: 64px; flex: none; border-radius: 50%; background: {{fill}}; color: {{ink}}; display: grid; place-items: center; font-size: 26px; font-weight: 850">{{initial}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<label for="pName" style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">NAME</label>
<input id="pName" value="{{name}}" onChange="{{onName}}" placeholder="Their name" style="width: 100%; box-sizing: border-box; border: 0; padding: 0; outline: none; background: transparent; font: 900 40px/1 Archivo, system-ui, sans-serif; font-stretch: 64%; color: #0E2A23">
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<div style="display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: #EEF1EA">
<button type="button" onClick="{{setKid}}" aria-pressed="{{kidTab.pressed}}" style="height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: {{kidTab.bg}}; font: {{kidTab.w}} 13px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">Kid</button>
<button type="button" onClick="{{setAdult}}" aria-pressed="{{adultTab.pressed}}" style="height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: {{adultTab.bg}}; font: {{adultTab.w}} 13px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">Adult</button>
</div>
<span style="flex: 1"></span>
<sc-if value="{{isKid}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ageDown}}" aria-label="Younger" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">−</button>
<span style="min-width: 58px; text-align: center; font-size: 15px; font-weight: 750">{{age}}</span>
<button type="button" onClick="{{ageUp}}" aria-label="Older" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">+</button>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<span style="flex: 1; font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">THEIR COLOR</span>
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="6">
<button type="button" onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" aria-label="{{w.aria}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><span style="width: 30px; height: 30px; border-radius: 50%; background: {{w.c}}; box-shadow: {{w.ring}}"></span></button>
</sc-for>
</div>
</section>

<section style="flex: none; background: #0E2A23; color: #EEF1EA; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<label for="pTell" style="display: inline-flex; align-items: center; gap: 8px; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #FF8A5E"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.6" fill="#0E2A23"/></svg>{{tellLabel}}</label>
<sc-if value="{{typing}}" hint-placeholder-val="{{ true }}">
<textarea id="pTell" value="{{text}}" onChange="{{onText}}" placeholder="Type it or say it. What do they always need, never use, or refuse to sleep without?" style="width: 100%; height: 84px; box-sizing: border-box; border: 0; outline: none; resize: none; border-radius: 14px; background: #163A31; padding: 12px; font: 500 16px/1.4 Archivo, system-ui, sans-serif; color: #EEF1EA"></textarea>
</sc-if>
<sc-if value="{{listening}}" hint-placeholder-val="{{ false }}">
<div style="height: 84px; border-radius: 14px; background: #163A31; display: flex; align-items: center; justify-content: center; gap: 5px">
<span style="width: 5px; height: 36px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out infinite"></span>
<span style="width: 5px; height: 36px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.15s infinite"></span>
<span style="width: 5px; height: 36px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.3s infinite"></span>
<span style="width: 5px; height: 36px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.45s infinite"></span>
<span style="width: 5px; height: 36px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.6s infinite"></span>
<span style="margin-left: 10px; font-size: 15px; font-weight: 650">Listening…</span>
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{toggleMic}}" aria-pressed="{{micPressed}}" aria-label="{{micAria}}" style="width: 52px; height: 52px; flex: none; border: 0; border-radius: 26px; background: {{micBg}}; display: grid; place-items: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<span style="flex: 1; font-size: 13px; line-height: 1.35; color: #B6C8C0">{{micHint}}</span>
</div>

<sc-if value="{{hasHeard}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #9FB5AC">SCOUT HEARD · SAVE WHAT'S RIGHT</span>
<sc-for list="{{heard}}" as="h" hint-placeholder-count="2">
<div style="border: 1.5px dashed #FF5B23; border-radius: 16px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 8px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{h.title}}</span><span style="font-size: 12px; line-height: 1.35; color: #B6C8C0">{{h.detail}}</span></span>
<button type="button" onClick="{{h.save}}" style="height: 44px; padding: 0 14px; flex: none; border: 0; border-radius: 12px; background: #FF5B23; color: #0E2A23; font: 750 14px Archivo, system-ui, sans-serif; cursor: pointer">Save</button>
<button type="button" onClick="{{h.skip}}" aria-label="{{h.skipAria}}" style="width: 44px; height: 44px; flex: none; border: 1.5px solid #3A6457; border-radius: 12px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</sc-for>
</div>
</sc-if>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">ALWAYS PACK</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{always}}" as="a" hint-placeholder-count="3">
<span style="height: 44px; padding: 0 2px 0 12px; border-radius: 14px; background: #EEF1EA; display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 650">{{a.label}}<button type="button" onClick="{{a.remove}}" aria-label="{{a.aria}}" style="width: 40px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<input value="{{newItem}}" onChange="{{onNewItem}}" aria-label="Add something to always pack" placeholder="Add an item" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1.5px solid #E3E8E0; border-radius: 12px; padding: 0 12px; background: #FFFFFF; font: 600 15px Archivo, system-ui, sans-serif; color: #0E2A23; outline: none">
<button type="button" onClick="{{addItem}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 14px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">Add</button>
</div>

<h2 style="margin: 6px 0 0; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">TRAVELS WITH</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{needs}}" as="n" hint-placeholder-count="6">
<button type="button" onClick="{{n.toggle}}" aria-pressed="{{n.pressed}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid {{n.bd}}; background: {{n.bg}}; color: {{n.fg}}; font: 650 14px Archivo, system-ui, sans-serif; cursor: pointer">{{n.label}}</button>
</sc-for>
</div>

<sc-if value="{{hasNotes}}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 6px 0 0; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">NOTES SCOUT KEEPS</h2>
<div style="display: flex; flex-direction: column">
<sc-for list="{{notes}}" as="m" hint-placeholder-count="1">
<div style="min-height: 48px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #EDF0EA">
<span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: {{m.dot}}"></span>
<span style="flex: 1; font-size: 14px; font-weight: 600; line-height: 1.3">{{m.text}}</span>
<button type="button" onClick="{{m.forget}}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #56665F; font: 650 13px Archivo, system-ui, sans-serif; cursor: pointer">Forget</button>
</div>
</sc-for>
</div>
</sc-if>
</section>

<button type="button" style="flex: none; height: 44px; border: 0; background: transparent; font: 700 14px Archivo, system-ui, sans-serif; color: #B23A0B; cursor: pointer">{{removeLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","new"],"default":"edit"},"$preview":{"width":390,"height":844}}'>
const KB_SW = [['#3A6BFF', '#FFFFFF', 'Blue'], ['#7BE0B5', '#0E2A23', 'Mint'], ['#FFC94A', '#0E2A23', 'Yellow'], ['#FF9BAE', '#0E2A23', 'Pink'], ['#B9A2FF', '#0E2A23', 'Lavender'], ['#FF8A5E', '#0E2A23', 'Coral']];
const KB_NEEDS = ['Stroller', 'Pull-ups', 'Car seat', 'Travel crib', 'High chair', 'Blackout shade'];
const KB_HEAR = [
  ['stroller', /stroller/, 'Naps in the stroller', 'Bring the stroller and a light blanket', 'Stroller'],
  ['pullups', /pull-?ups?|diaper/, 'Pull-ups at night', 'One per night, plus three spares', 'Pull-ups'],
  ['carsick', /carsick|car sick|motion/, 'Gets carsick', 'Sick bags and wipes in the day bag', null],
  ['cold', /\bcold\b/, 'Runs cold', 'Add a warm sleep layer', null],
  ['snacks', /picky|snack/, 'Particular about snacks', 'Familiar snacks for travel days', null],
  ['swim', /swim|water/, 'Loves the water', 'Swimsuit on any trip with a pool or beach', null]
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const fresh = props.mode === 'new';
    this.state = fresh
      ? { fresh, name: '', kid: true, age: 4, color: 4, text: '', mic: false, handled: {}, always: [], needs: {}, notes: [], newItem: '' }
      : { fresh, name: 'Ivy', kid: true, age: 3, color: 3, text: 'She naps in the stroller and still needs pull-ups at night.', mic: false, handled: {}, always: ['Bunny (the one)', 'Night-light', 'Favorite blanket'], needs: { 'Blackout shade': true }, notes: ['The bunny rides in the carry-on, never checked'], newItem: '' };
  }
  renderVals() {
    const s = this.state;
    const sw = KB_SW[s.color];
    const who = s.name.trim() || (s.kid ? 'this kid' : 'them');
    const tab = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', w: on ? '750' : '550', pressed: on ? 'true' : 'false' });
    const low = s.text.toLowerCase();
    const heard = KB_HEAR.filter((h) => !s.handled[h[0]] && h[1].test(low)).map((h) => ({
      title: h[2], detail: h[3], skipAria: 'Skip: ' + h[2],
      save: () => this.setState({ handled: { ...s.handled, [h[0]]: true }, notes: s.notes.concat(h[2] + ' → ' + h[3].charAt(0).toLowerCase() + h[3].slice(1)), needs: h[4] ? { ...s.needs, [h[4]]: true } : s.needs }),
      skip: () => this.setState({ handled: { ...s.handled, [h[0]]: true } })
    }));
    return {
      headLabel: s.fresh ? 'NEW CREW MEMBER' : 'CREW · PROFILE',
      fill: sw[0], ink: sw[1],
      initial: s.name.trim() ? s.name.trim().charAt(0).toUpperCase() : '?',
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      isKid: s.kid, kidTab: tab(s.kid), adultTab: tab(!s.kid),
      setKid: () => this.setState({ kid: true }), setAdult: () => this.setState({ kid: false }),
      age: s.age === 0 ? 'Under 1' : s.age + (s.age === 1 ? ' yr' : ' yrs'),
      ageUp: () => this.setState({ age: Math.min(17, s.age + 1) }),
      ageDown: () => this.setState({ age: Math.max(0, s.age - 1) }),
      swatches: KB_SW.map((w, i) => ({ c: w[0], aria: w[2], pressed: i === s.color ? 'true' : 'false', ring: i === s.color ? '0 0 0 2px #FFFFFF, 0 0 0 4px #0E2A23' : 'none', pick: () => this.setState({ color: i }) })),
      tellLabel: 'TELL SCOUT ABOUT ' + who.toUpperCase(),
      typing: !s.mic, listening: s.mic,
      text: s.text, onText: (e) => this.setState({ text: e.target.value }),
      toggleMic: () => this.setState({ mic: !s.mic }),
      micPressed: s.mic ? 'true' : 'false',
      micAria: s.mic ? 'Stop listening' : 'Talk instead of typing',
      micBg: s.mic ? '#FFFFFF' : '#FF5B23',
      micHint: s.mic ? 'Tap the mic again when you are done.' : 'Type above or tap to talk. I only save what you approve.',
      hasHeard: heard.length > 0, heard,
      always: s.always.map((a, i) => ({ label: a, aria: 'Remove ' + a, remove: () => this.setState({ always: s.always.filter((x, j) => j !== i) }) })),
      newItem: s.newItem, onNewItem: (e) => this.setState({ newItem: e.target.value }),
      addItem: () => { const v = s.newItem.trim(); if (v) this.setState({ always: s.always.concat(v), newItem: '' }); },
      needs: KB_NEEDS.map((n) => { const on = !!s.needs[n]; return { label: n, pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#D9DFD6', toggle: () => this.setState({ needs: { ...s.needs, [n]: !on } }) }; }),
      hasNotes: s.notes.length > 0,
      notes: s.notes.map((t, i) => ({ text: t, dot: sw[0], forget: () => this.setState({ notes: s.notes.filter((x, j) => j !== i) }) })),
      removeLabel: s.fresh ? 'Cancel' : 'Remove ' + who + ' from the crew'
    };
  }
}
</script>
</body>
</html>
