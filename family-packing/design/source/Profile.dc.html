<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Crew profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#56665F}
textarea::placeholder{color:#9FB5AC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="Crew.dc.html" aria-label="Back to crew" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">{{headLabel}}</span>
<a href="Crew.dc.html" style="height: 44px; padding: 0 18px; border-radius: 14px; background: #0E2A23; color: #EEF1EA; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700">Done</a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px">

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="position: relative; display: inline-block; flex: none; width: 64px; height: 64px; flex: none"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="display: block"><circle cx="32" cy="32" r="30.75" fill="none" stroke="{{ring}}" stroke-width="2.5"></circle><circle cx="32" cy="32" r="25" fill="{{fill}}"></circle></svg><span aria-hidden="true" style="position: absolute; inset: 0; display: grid; place-items: center; font-family: Archivo, system-ui, sans-serif; font-size: 22px; font-weight: 600; color: #0E2A23; line-height: 1">{{initial}}</span></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<label for="pName" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Name</label>
<input id="pName" value="{{name}}" onChange="{{onName}}" placeholder="Their name" style="width: 100%; box-sizing: border-box; border: 0; padding: 0; outline: none; background: transparent; font: 900 40px/1 Archivo, system-ui, sans-serif; font-stretch: 62.5%; color: #0E2A23">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Born</span>
<span style="font-size: 12px; color: #56665F">Month and year only</span>
</div>
<div style="display: grid; grid-template-columns: 3fr 2fr; gap: 8px">
<label style="position: relative"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Birth month</span><select value="{{bm}}" onChange="{{onBm}}" style="width: 100%; height: 48px; box-sizing: border-box; border: 0; border-radius: 14px; background: #EEF1EA; padding: 0 30px 0 14px; font: 600 16px Archivo, system-ui, sans-serif; color: #0E2A23; appearance: none; -webkit-appearance: none; cursor: pointer"><sc-for list="{{months}}" as="o" hint-placeholder-count="13"><option value="{{o.v}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; top: 18px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></label>
<label style="position: relative"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Birth year</span><select value="{{by}}" onChange="{{onBy}}" style="width: 100%; height: 48px; box-sizing: border-box; border: 0; border-radius: 14px; background: #EEF1EA; padding: 0 30px 0 14px; font: 600 16px Archivo, system-ui, sans-serif; color: #0E2A23; appearance: none; -webkit-appearance: none; cursor: pointer"><sc-for list="{{years}}" as="o" hint-placeholder-count="20"><option value="{{o.v}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; top: 18px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></label>
</div>
<div style="min-height: 44px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #D9DFD6; padding: 8px 14px; display: flex; align-items: center; gap: 10px">
<span style="font-size: 20px; font-weight: 700">{{ageNow}}</span>
<span style="flex: 1; font-size: 12px; line-height: 1.35; color: #56665F">{{ageNote}}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<span style="flex: 1; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Their color</span>
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="6">
<button type="button" onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" aria-label="{{w.aria}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 50%; background: {{w.c}}; box-shadow: {{w.sel}}"></span></button>
</sc-for>
</div>
</section>

<section style="flex: none; background: #0E2A23; color: #EEF1EA; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<label for="pTell" style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9FB5AC"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.6" fill="#0E2A23"></circle></svg>{{tellLabel}}</label>
<div style="position: relative">
<textarea id="pTell" value="{{text}}" onChange="{{onText}}" placeholder="What do they always need, never use, or refuse to sleep without?" style="width: 100%; height: 96px; box-sizing: border-box; border: 0; outline: none; resize: none; border-radius: 14px; background: #163A31; padding: 12px 56px 12px 14px; font: 500 16px/1.4 Archivo, system-ui, sans-serif; color: #EEF1EA"></textarea>
<a href="VoiceRecord.dc.html" aria-label="Talk instead of typing" style="position: absolute; right: 6px; bottom: 10px; width: 44px; height: 44px; border-radius: 999px; background: #21463B; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
</div>
<span style="font-size: 12px; color: #B6C8C0">Scout only saves what you approve.</span>

<sc-if value="{{hasHeard}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{heard}}" as="h" hint-placeholder-count="2">
<div style="border: 1.5px dashed #FF5B23; border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 8px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{h.title}}</span><span style="font-size: 12px; line-height: 1.35; color: #B6C8C0">{{h.detail}}</span></span>
<button type="button" onClick="{{h.save}}" style="height: 44px; padding: 0 14px; flex: none; border: 0; border-radius: 14px; background: #EEF1EA; color: #0E2A23; font: 700 14px Archivo, system-ui, sans-serif; cursor: pointer">Save</button>
<button type="button" onClick="{{h.skip}}" aria-label="{{h.skipAria}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B6C8C0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
</sc-if>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Always pack</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{always}}" as="a" hint-placeholder-count="3">
<span style="height: 40px; padding: 0 0 0 14px; border-radius: 999px; background: #EEF1EA; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600">{{a.label}}<button type="button" onClick="{{a.remove}}" aria-label="{{a.aria}}" style="width: 40px; height: 40px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<input value="{{newItem}}" onChange="{{onNewItem}}" aria-label="Add something to always pack" placeholder="Add an item" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #7D8B85; border-radius: 14px; padding: 0 14px; background: #FFFFFF; font: 500 16px Archivo, system-ui, sans-serif; color: #0E2A23; outline: none">
<button type="button" onClick="{{addItem}}" style="height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: #0E2A23; font: 700 14px Archivo, system-ui, sans-serif; color: #EEF1EA; cursor: pointer">Add</button>
</div>

<h2 style="margin: 8px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Travels with</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{needs}}" as="n" hint-placeholder-count="6">
<button type="button" onClick="{{n.toggle}}" aria-pressed="{{n.pressed}}" style="height: 40px; padding: 0 14px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{n.bd}}; background: {{n.bg}}; color: {{n.fg}}; font: 600 14px Archivo, system-ui, sans-serif; cursor: pointer">{{n.label}}</button>
</sc-for>
</div>

<sc-if value="{{hasNotes}}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 8px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">What Scout remembers</h2>
<div style="display: flex; flex-direction: column">
<sc-for list="{{notes}}" as="m" hint-placeholder-count="1">
<div style="min-height: 48px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #EDF0EA">
<span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: {{m.dot}}"></span>
<span style="flex: 1; font-size: 14px; font-weight: 600; line-height: 1.3">{{m.text}}</span>
<button type="button" onClick="{{m.forget}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #0E2A23; font: 600 14px Archivo, system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Forget</button>
</div>
</sc-for>
</div>
</sc-if>
</section>

<a href="{{removeHref}}" style="flex: none; height: 44px; display: grid; place-items: center; font-size: 14px; font-weight: 600; color: {{removeColor}}; text-decoration: underline; text-underline-offset: 3px">{{removeLabel}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","new"],"default":"edit"},"$preview":{"width":390,"height":844}}'>
const KB_SW = [['#AFC6FF', '#2D55D6', 'Blue'], ['#7BE0B5', '#0F8A5F', 'Mint'], ['#FFC94A', '#B57A00', 'Yellow'], ['#FF9BAE', '#E0476A', 'Pink'], ['#C9B8FF', '#6A4FD0', 'Lavender'], ['#FFB38F', '#C4561D', 'Peach']];
const KM_MON_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const KM_MONTHS = [{ v: '', label: 'Month' }].concat(KM_MON_FULL.map((m, i) => ({ v: String(i), label: m })));
const KM_YEARS = [{ v: '', label: 'Year' }].concat(Array.from({ length: 19 }, (x, i) => ({ v: String(2026 - i), label: String(2026 - i) })));
const KB_NEEDS = ['Stroller', 'Pull-ups', 'Car seat', 'Travel crib', 'High chair', 'Blackout shade'];
const KB_HEAR = [
  ['stroller', /stroller/, 'Naps in the stroller', 'Bring the stroller and a light blanket', 'Stroller'],
  ['pullups', /pull-?ups?|diaper/, 'Pull-ups at night', 'One per night, plus three spares', 'Pull-ups'],
  ['carsick', /carsick|car sick|motion/, 'Gets carsick', 'Sick bags and wipes in the day bag', null],
  ['cold', /\bcold\b/, 'Runs cold', 'Add a warm sleep layer', null],
  ['snacks', /picky|snack/, 'Particular about snacks', 'Familiar snacks for travel days', null],
  ['swim', /swim|water/, 'Loves the water', 'Swimsuit on any trip with a pool or beach', null]
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const fresh = props.mode === 'new';
    this.state = fresh
      ? { fresh, name: '', bm: '', by: '', color: 4, text: '', handled: {}, always: [], needs: {}, notes: [], newItem: '' }
      : { fresh, name: 'Ivy', bm: '6', by: '2023', color: 3, text: 'She naps in the stroller and still needs pull-ups at night.', handled: {}, always: ['Bunny (the one)', 'Night-light', 'Favorite blanket'], needs: { 'Blackout shade': true }, notes: ['The bunny goes in the carry-on'], newItem: '' };
  }
  renderVals() {
    const s = this.state;
    const sw = KB_SW[s.color];
    const who = s.name.trim() || 'them';
    const age = s.bm !== '' && s.by !== '' ? Math.floor(((2026 - Number(s.by)) * 12 + (10 - Number(s.bm))) / 12) : null;
    const low = s.text.toLowerCase();
    const heard = KB_HEAR.filter((h) => !s.handled[h[0]] && h[1].test(low)).map((h) => ({
      title: h[2], detail: h[3], skipAria: 'Skip: ' + h[2],
      save: () => this.setState({ handled: { ...s.handled, [h[0]]: true }, notes: s.notes.concat(h[2] + ': ' + h[3].charAt(0).toLowerCase() + h[3].slice(1)), needs: h[4] ? { ...s.needs, [h[4]]: true } : s.needs }),
      skip: () => this.setState({ handled: { ...s.handled, [h[0]]: true } })
    }));
    return {
      headLabel: s.fresh ? 'New person' : 'Crew · profile',
      fill: sw[0], ring: sw[1],
      initial: s.name.trim() ? s.name.trim().charAt(0).toUpperCase() : '?',
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      bm: s.bm, by: s.by,
      onBm: (e) => this.setState({ bm: e.target.value }),
      onBy: (e) => this.setState({ by: e.target.value }),
      months: KM_MONTHS, years: KM_YEARS,
      ageNow: age === null ? 'Adult' : (age < 1 ? 'Under 1' : age + (age === 1 ? ' yr' : ' yrs')),
      ageNote: age === null ? 'No birth date needed for adults. Add one if you like.' : 'Updates on its own. ' + who.charAt(0).toUpperCase() + who.slice(1) + ' turns ' + (age + 1) + ' in ' + KM_MON_FULL[Number(s.bm)] + '. Scout uses the age on each trip date.',
      swatches: KB_SW.map((w, i) => ({ c: w[0], aria: w[2], pressed: i === s.color ? 'true' : 'false', sel: i === s.color ? '0 0 0 2px #FFFFFF, 0 0 0 4.5px ' + w[1] : 'none', pick: () => this.setState({ color: i }) })),
      tellLabel: 'Tell Scout about ' + who,
      text: s.text, onText: (e) => this.setState({ text: e.target.value }),
      hasHeard: heard.length > 0, heard,
      always: s.always.map((a, i) => ({ label: a, aria: 'Remove ' + a, remove: () => this.setState({ always: s.always.filter((x, j) => j !== i) }) })),
      newItem: s.newItem, onNewItem: (e) => this.setState({ newItem: e.target.value }),
      addItem: () => { const v = s.newItem.trim(); if (v) this.setState({ always: s.always.concat(v), newItem: '' }); },
      needs: KB_NEEDS.map((n) => { const on = !!s.needs[n]; return { label: n, pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#7D8B85', toggle: () => this.setState({ needs: { ...s.needs, [n]: !on } }) }; }),
      hasNotes: s.notes.length > 0,
      notes: s.notes.map((t, i) => ({ text: t, dot: sw[0], forget: () => this.setState({ notes: s.notes.filter((x, j) => j !== i) }) })),
      removeLabel: s.fresh ? 'Cancel' : 'Remove ' + who + ' from the crew',
      removeHref: s.fresh ? 'Crew.dc.html' : 'Confirm.dc.html',
      removeColor: s.fresh ? '#0E2A23' : '#B42318'
    };
  }
}
</script>
</body>
</html>
