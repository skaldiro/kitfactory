<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Building your lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E2A23}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
@keyframes kmOrbit{to{transform:rotate(360deg)}}
@keyframes kmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes kmBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes kmIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E2A23; color: #EEF1EA; font-family: Archivo, system-ui, sans-serif">

<p style="position: absolute; left: 0; right: 0; top: 36px; margin: 0; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9FB5AC">{{topLabel}}</p>

<div aria-hidden="true" style="position: absolute; left: 85px; top: 92px; width: 220px; height: 220px">
<span style="position: absolute; left: 0; top: 0; width: 220px; height: 220px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #3A6457"></span>
<span style="position: absolute; left: 40px; top: 40px; width: 140px; height: 140px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #234A3F"></span>
<div style="position: absolute; left: 0; top: 0; width: 220px; height: 220px; animation: kmOrbit 28s linear infinite">
<sc-for list="{{orbit}}" as="o" hint-placeholder-count="4">
<span style="position: absolute; left: {{o.x}}px; top: {{o.y}}px; width: 40px; height: 40px; animation: kmOrbit 28s linear infinite reverse"><span style="position: relative; display: inline-block; flex: none; width: 40px; height: 40px"><svg width="40" height="40" viewBox="0 0 40 40" style="display: block"><circle cx="20" cy="20" r="18.75" fill="#0E2A23" stroke="{{o.ring}}" stroke-width="2.5"></circle><circle cx="20" cy="20" r="14" fill="{{o.fill}}"></circle></svg><span aria-hidden="true" style="position: absolute; inset: 0; display: grid; place-items: center; font-family: Archivo, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #0E2A23; line-height: 1">{{o.s}}</span></span></span>
</sc-for>
</div>
<div style="position: absolute; left: 75px; top: 75px; width: 70px; height: 70px; display: grid; place-items: center; animation: kmPulse 2.4s ease-in-out infinite">
<svg width="70" height="70" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.2" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.4" fill="#0E2A23"></circle></svg>
</div>
</div>

<h1 style="position: absolute; left: 24px; right: 24px; top: 344px; margin: 0; font-size: 40px; line-height: 0.95; font-weight: 900; font-stretch: 62.5%">{{headline}}</h1>

<ol aria-live="polite" style="position: absolute; left: 24px; right: 24px; top: 402px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
<li style="display: flex; align-items: flex-start; gap: 12px; animation: kmIn 300ms ease-out both">
<span style="width: 22px; height: 22px; flex: none; margin-top: 1px; display: grid; place-items: center">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#EEF1EA"></circle><path d="M6.5 11.5l3 3 6-6.5" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #EEF1EA; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #EEF1EA; animation: kmBlink 1s ease-in-out infinite"></span></span></sc-if>
<sc-if value="{{s.pending}}" hint-placeholder-val="{{ true }}"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #3A6457"></span></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 1.25; font-weight: {{s.weight}}; color: {{s.color}}">{{s.title}}</span>
<sc-if value="{{s.showDetail}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; line-height: 1.35; color: #9FB5AC">{{s.detail}}</span></sc-if>
</span>
</li>
</sc-for>
</ol>

<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="Reveal.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 56px; border-radius: 14px; background: #EEF1EA; color: #0E2A23; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">See the list<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
<p style="position: absolute; left: 24px; right: 24px; bottom: 40px; margin: 0; text-align: center; font-size: 14px; color: #9FB5AC">Your trip is saved, even if something goes wrong.</p>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startStage":{"editor":"enum","options":["1","2","3","4","5","Done"],"default":"3"},"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
const KM_STAGES = [
  ['Checking the weather at 3 stops', 'Rome 46–60°F, Florence colder, wet trails in Cinque Terre'],
  ['Adding what the coastal hike needs', 'Rain shells ×4, trail shoes, snacks for the day bag'],
  ["Sizing Leo's and Ivy's lists", 'Pull-ups for 9 nights, the stroller, a warm layer for Leo'],
  ['Counting clothes around laundry in Florence', 'Five days of outfits each, not nine'],
  ['Splitting 160 items into 5 lists', 'Nadia, Sam, Leo, Ivy and Shared']
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const v = props.startStage || '3';
    this.state = { stage: v === 'Done' ? 5 : Number(v) - 1 };
  }
  componentDidMount() {
    if (this.props.autoplay === false) return;
    this._t = setInterval(() => {
      if (this.state.stage >= 5) { clearInterval(this._t); return; }
      this.setState({ stage: this.state.stage + 1 });
    }, 1800);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const stage = this.state.stage;
    const done = stage >= 5;
    return {
      topLabel: done ? 'Ready' : 'Scout is packing for Italy',
      headline: done ? 'Your lists are ready.' : 'Packing for four.',
      orbit: [['N', '#AFC6FF', '#2D55D6', 90, -20], ['S', '#7BE0B5', '#0F8A5F', 200, 90], ['L', '#FFC94A', '#B57A00', 90, 200], ['I', '#FF9BAE', '#E0476A', -20, 90]].map((o) => ({ s: o[0], fill: o[1], ring: o[2], x: o[3], y: o[4] })),
      stages: KM_STAGES.map((t, i) => ({
        title: t[0], detail: t[1],
        done: i < stage, active: i === stage, pending: i > stage,
        showDetail: i <= stage,
        color: i > stage ? '#9FB5AC' : '#EEF1EA',
        weight: i === stage ? '700' : '600'
      })),
      ready: done,
      working: !done
    };
  }
}
</script>
</body>
</html>
