<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Building your lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0E2A23}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
@keyframes kbOrbit{to{transform:rotate(360deg)}}
@keyframes kbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes kbBlink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E2A23; color: #EEF1EA; font-family: Archivo, system-ui, sans-serif">
<svg width="390" height="844" viewBox="0 0 390 844" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g stroke="#1C4036" stroke-width="1.25">
<g transform="translate(60 760)">
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(.8)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(1.6)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(2.5)" vector-effect="non-scaling-stroke"/>
<path d="M0-50C32-50 58-28 56 2 54 34 26 54-6 52-38 50-60 26-56-6-52-36-30-50 0-50Z" transform="scale(3.5)" vector-effect="non-scaling-stroke"/>
</g>
</g>
</svg>

<p style="position: absolute; left: 0; right: 0; top: 34px; margin: 0; text-align: center; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.12em; color: #9FB5AC">{{topLabel}}</p>

<div aria-hidden="true" style="position: absolute; left: 45px; top: 96px; width: 300px; height: 300px">
<span style="position: absolute; left: 0; top: 0; width: 300px; height: 300px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #3A6457"></span>
<span style="position: absolute; left: 50px; top: 50px; width: 200px; height: 200px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #234A3F"></span>
<div style="position: absolute; left: 0; top: 0; width: 300px; height: 300px; animation: kbOrbit 16s linear infinite reverse">
<span style="position: absolute; left: 216px; top: 216px; width: 10px; height: 10px; border-radius: 50%; background: #FF5B23"></span>
<span style="position: absolute; left: 48px; top: 171px; width: 8px; height: 8px; border-radius: 50%; background: #FFC94A"></span>
<span style="position: absolute; left: 171px; top: 48px; width: 8px; height: 8px; border-radius: 50%; background: #7BE0B5"></span>
</div>
<div style="position: absolute; left: 0; top: 0; width: 300px; height: 300px; animation: kbOrbit 28s linear infinite">
<span style="position: absolute; left: 124px; top: -16px; width: 52px; height: 52px; border-radius: 50%; background: #3A6BFF; color: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 800; animation: kbOrbit 28s linear infinite reverse">You</span>
<span style="position: absolute; left: 264px; top: 124px; width: 52px; height: 52px; border-radius: 50%; background: #7BE0B5; color: #0E2A23; display: grid; place-items: center; font-size: 18px; font-weight: 850; font-stretch: 70%; animation: kbOrbit 28s linear infinite reverse">+1</span>
<span style="position: absolute; left: 124px; top: 264px; width: 52px; height: 52px; border-radius: 50%; background: #FFC94A; color: #0E2A23; display: grid; place-items: center; font-size: 26px; font-weight: 900; font-stretch: 64%; animation: kbOrbit 28s linear infinite reverse">6</span>
<span style="position: absolute; left: -16px; top: 124px; width: 52px; height: 52px; border-radius: 50%; background: #FF9BAE; color: #0E2A23; display: grid; place-items: center; font-size: 26px; font-weight: 900; font-stretch: 64%; animation: kbOrbit 28s linear infinite reverse">3</span>
</div>
<div style="position: absolute; left: 102px; top: 102px; width: 96px; height: 96px; display: grid; place-items: center; animation: kbPulse 2.4s ease-in-out infinite">
<svg width="96" height="96" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.2" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.4" fill="#0E2A23"/></svg>
</div>
</div>

<h1 style="position: absolute; left: 24px; right: 24px; top: 436px; margin: 0; font-size: 56px; line-height: 0.9; font-weight: 900; font-stretch: 64%; letter-spacing: -0.01em">{{headline}}</h1>

<ol style="position: absolute; left: 24px; right: 24px; top: 508px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: {{s.weight}}; color: {{s.color}}">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FF5B23; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
<sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #FF5B23; display: grid; place-items: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF5B23; animation: kbBlink 1s ease-in-out infinite"></span></span></sc-if>
<sc-if value="{{s.pending}}" hint-placeholder-val="{{ true }}"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #3A6457"></span></sc-if>
{{s.text}}
</li>
</sc-for>
</ol>

<p style="position: absolute; left: 24px; right: 24px; top: 640px; margin: 0; font-size: 13px; line-height: 1.45; color: #9FB5AC">A curated catalog and family rules set the basics. Scout tailors the rest, and you'll see why it added anything unusual.</p>

<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="Reveal.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 60px; border-radius: 20px; background: #FF5B23; color: #0E2A23; display: flex; align-items: center; justify-content: space-between; padding: 0 9px 0 22px; font-size: 19px; font-weight: 750">See our list<span style="width: 44px; height: 44px; border-radius: 14px; background: #0E2A23; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF1EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
<p style="position: absolute; left: 0; right: 0; bottom: 44px; margin: 0; text-align: center; font-size: 14px; color: #9FB5AC">Your description is saved, even if something goes wrong.</p>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startStage":{"editor":"enum","options":["1","2","3","Done"],"default":"2"},"autoplay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const map = { '1': 0, '2': 1, '3': 2, 'Done': 3 };
    this.state = { stage: map[props.startStage || '2'] ?? 1 };
  }
  componentDidMount() {
    if (this.props.autoplay === false) return;
    this._t = setInterval(() => {
      if (this.state.stage >= 3) { clearInterval(this._t); return; }
      this.setState({ stage: this.state.stage + 1 });
    }, 2400);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const stage = this.state.stage;
    const texts = ['Planning for everyone…', "Checking children's essentials…", 'Organizing your lists…'];
    return {
      topLabel: stage >= 3 ? 'ALL SET' : 'BUILDING YOUR LISTS',
      headline: stage >= 3 ? 'Packed. On paper.' : 'Packing for four.',
      stages: texts.map((t, i) => ({
        text: t,
        done: i < stage, active: i === stage, pending: i > stage,
        color: i > stage ? '#8FA79D' : (i === stage ? '#EEF1EA' : '#B6C8C0'),
        weight: i === stage ? '700' : '500'
      })),
      ready: stage >= 3,
      working: stage < 3
    };
  }
}
</script>
</body>
</html>
