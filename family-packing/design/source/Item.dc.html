<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Item details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#56665F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF"></span><span style="font-size: 28px; font-weight: 900; font-stretch: 62.5%">Italy</span></div>
<div style="height: 120px; border-radius: 22px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Edit item" style="position: absolute; left: 0; right: 0; top: 112px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #D9DFD6"></span>

<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF9BAE"></span>Ivy · Clothing</span>
<input aria-label="Item name" value="{{name}}" onChange="{{onName}}" style="width: 100%; border: 0; padding: 0; outline: none; font: 900 28px/1 Archivo, system-ui, sans-serif; font-stretch: 62.5%; color: #0E2A23; background: transparent">
</div>
<a href="Pack.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: #56665F"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.6" fill="#0E2A23"></circle></svg><span>Three because of a wash around day 5, plus a spare.</span></p>

<div style="display: flex; flex-direction: column">
<sc-for list="{{counts}}" as="g" hint-placeholder-count="2">
<div style="min-height: 56px; display: flex; align-items: center; gap: 12px; border-top: {{g.line}}">
<span style="flex: 1; font-size: 16px; font-weight: 600">{{g.label}}</span>
<div style="display: flex; align-items: center; border-radius: 14px; background: #EEF1EA">
<button type="button" onClick="{{g.down}}" aria-label="{{g.downAria}}" style="width: 44px; height: 44px; border: 0; background: transparent; font: 600 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">−</button>
<span style="min-width: 32px; text-align: center; font-size: 16px; font-weight: 700">{{g.n}}</span>
<button type="button" onClick="{{g.up}}" aria-label="{{g.upAria}}" style="width: 44px; height: 44px; border: 0; background: transparent; font: 600 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">+</button>
</div>
</div>
</sc-for>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Shopping</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #EEF1EA">
<sc-for list="{{statuses}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; border: 0; border-radius: 10px; background: {{o.bg}}; color: #0E2A23; font: {{o.w}} 14px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="width: 100%; padding: 0; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F"><span>Bag</span><span style="font-weight: 500; letter-spacing: 0; text-transform: none">Optional</span></legend>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{bags}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; flex: none; padding: 0 14px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: 600 14px Archivo, system-ui, sans-serif; white-space: nowrap; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="itemNote" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Note</label>
<div style="height: 48px; box-sizing: border-box; border: 1.5px solid #7D8B85; border-radius: 14px; padding: 0 2px 0 14px; display: flex; align-items: center; gap: 4px">
<input id="itemNote" value="{{note}}" onChange="{{onNote}}" placeholder="Add a note" style="flex: 1; min-width: 0; border: 0; padding: 0; outline: none; background: transparent; font: 500 16px Archivo, system-ui, sans-serif; color: #0E2A23">
<a href="VoiceRecord.dc.html" aria-label="Say the note instead" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
</div>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
<a href="Confirm.dc.html" style="height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Remove from list</a>
<span style="flex: 1"></span>
<a href="Pack.dc.html" style="height: 56px; padding: 0 32px; border-radius: 14px; background: #0E2A23; color: #EEF1EA; display: inline-flex; align-items: center; font-size: 16px; font-weight: 700">Done</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KM_BAGS = [['none', 'No bag yet'], ['chk', 'Checked case'], ['co', 'Carry-on'], ['leo', "Leo's backpack"], ['day', 'Day bag']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Pajamas', need: 3, packed: 2, status: 'have', bag: 'chk', note: 'Long-sleeve ones' };
  }
  renderVals() {
    const s = this.state;
    const counts = [
      { label: 'Need', n: s.need, line: '0', downAria: 'Need one fewer', upAria: 'Need one more',
        down: () => this.setState({ need: Math.max(1, s.need - 1), packed: Math.min(s.packed, Math.max(1, s.need - 1)) }),
        up: () => this.setState({ need: s.need + 1 }) },
      { label: 'Packed', n: s.packed + ' of ' + s.need, line: '1px solid #EDF0EA', downAria: 'Packed one fewer', upAria: 'Packed one more',
        down: () => this.setState({ packed: Math.max(0, s.packed - 1) }),
        up: () => this.setState({ packed: Math.min(s.need, s.packed + 1) }) }
    ];
    const statuses = [['have', 'Have it'], ['need', 'To buy'], ['bought', 'Bought']].map((o) => {
      const on = s.status === o[0];
      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', w: on ? '700' : '500', pick: () => this.setState({ status: o[0] }) };
    });
    const bags = KM_BAGS.map((o) => {
      const on = s.bag === o[0];
      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#7D8B85', pick: () => this.setState({ bag: o[0] }) };
    });
    return {
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      note: s.note, onNote: (e) => this.setState({ note: e.target.value }),
      counts, statuses, bags
    };
  }
}
</script>
</body>
</html>
