<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Item details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="font-size: 30px; font-weight: 900; font-stretch: 64%">Italy</span></div>
<div style="height: 8px; border-radius: 4px; background: #D9DFD6"></div>
<div style="height: 120px; border-radius: 20px; background: #FFFFFF"></div>
<div style="height: 200px; border-radius: 20px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Edit item" style="position: absolute; left: 0; right: 0; top: 78px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9DFD6"></span>

<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<label for="itemName" style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">ITEM</label>
<input id="itemName" value="{{name}}" onChange="{{onName}}" style="width: 100%; border: 0; padding: 0; outline: none; font: 900 34px/1 Archivo, system-ui, sans-serif; font-stretch: 66%; color: #0E2A23; background: transparent">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FF9BAE; display: grid; place-items: center; font-size: 10px; font-weight: 800">I</span>Ivy, 3 · Clothing</span>
</div>
<a href="Pack.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="background: #EEF1EA; border-radius: 16px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.6" fill="#0E2A23"/></svg>
<span style="font-size: 13px; line-height: 1.4"><strong>Why 3?</strong> Ten nights, a wash around day 5, plus one spare for spills.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="border: 1.5px solid #E3E8E0; border-radius: 16px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">NEED</span>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" onClick="{{needDown}}" aria-label="Need one fewer" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">−</button>
<span style="font-size: 34px; font-weight: 900; font-stretch: 64%">{{need}}</span>
<button type="button" onClick="{{needUp}}" aria-label="Need one more" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">+</button>
</div>
</div>
<div style="border: 1.5px solid #E3E8E0; border-radius: 16px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">PACKED</span>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" onClick="{{packDown}}" aria-label="Packed one fewer" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">−</button>
<span style="font-size: 34px; font-weight: 900; font-stretch: 64%">{{packed}}<span style="font-size: 18px; color: #56665F">/{{need}}</span></span>
<button type="button" onClick="{{packUp}}" aria-label="Packed one more" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #EEF1EA; font: 700 20px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">+</button>
</div>
</div>
</div>
<div style="margin-top: -6px; height: 6px; border-radius: 3px; background: #EEF1EA; overflow: hidden"><div style="height: 6px; width: {{packW}}; background: #E0476A; border-radius: 3px"></div></div>
<sc-if value="{{zero}}" hint-placeholder-val="{{ false }}">
<p style="margin: -6px 0 0; font-size: 12px; color: #B23A0B">Zero means this item won't count toward progress. Remove it instead?</p>
</sc-if>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">SHOPPING · SEPARATE FROM PACKING</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 13px; background: #EEF1EA">
<sc-for list="{{statuses}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 38px; border: 0; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}; font: {{o.w}} 13px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">BAG</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{bags}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: 650 13px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px dashed #8A9892; background: transparent; color: #0E2A23; font: 650 13px Archivo, system-ui, sans-serif; cursor: pointer">+ New bag</button>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="itemNote" style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">NOTE</label>
<div style="display: flex; gap: 8px">
<textarea id="itemNote" value="{{note}}" onChange="{{onNote}}" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; resize: none; border: 1.5px solid #E3E8E0; border-radius: 14px; padding: 6px 12px; font: 500 14px/1.3 Archivo, system-ui, sans-serif; color: #0E2A23; outline: none"></textarea>
<button type="button" onClick="{{toggleMic}}" aria-pressed="{{micPressed}}" aria-label="{{micAria}}" style="width: 48px; height: 48px; flex: none; border: 0; border-radius: 24px; background: {{micBg}}; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{micInk}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>
</div>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
<button type="button" style="height: 48px; padding: 0 6px; border: 0; background: transparent; font: 700 14px Archivo, system-ui, sans-serif; color: #B23A0B; cursor: pointer">Remove from list</button>
<a href="Pack.dc.html" style="height: 52px; padding: 0 28px; border-radius: 16px; background: #0E2A23; color: #EEF1EA; display: inline-flex; align-items: center; font-size: 16px; font-weight: 750">Done</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Pajamas', need: 3, packed: 2, status: 'have', bag: 'chk', who: 'any', note: 'Long-sleeve ones. It gets cool at night in late November.' };
  }
  renderVals() {
    const s = this.state;
    const pill = (on) => ({ bg: on ? '#0E2A23' : '#FFFFFF', fg: on ? '#EEF1EA' : '#0E2A23', bd: on ? '#0E2A23' : '#D9DFD6', pressed: on ? 'true' : 'false' });
    const statuses = [['have', 'Have it'], ['need', 'Need to buy'], ['bought', 'Bought']].map((o) => {
      const on = s.status === o[0];
      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: '#0E2A23', w: on ? '750' : '550', pick: () => this.setState({ status: o[0] }) };
    });
    const bags = [['chk', 'Checked case'], ['co', 'Carry-on'], ['leo', "Leo's backpack"], ['day', 'Day bag']].map((o) => ({ label: o[1], ...pill(s.bag === o[0]), pick: () => this.setState({ bag: o[0] }) }));
    const whos = [['any', 'Anyone', '', '#EEF1EA', '#0E2A23'], ['nadia', 'Nadia', 'N', '#3A6BFF', '#FFFFFF'], ['sam', 'Sam', 'S', '#7BE0B5', '#0E2A23']].map((o) => ({ label: o[1], short: o[2], fill: o[3], ink: o[4], ...pill(s.who === o[0]), pick: () => this.setState({ who: o[0] }) }));
    return {
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      note: s.note, onNote: (e) => this.setState({ note: e.target.value }),
      need: s.need, packed: s.packed,
      packW: s.need ? Math.round(s.packed / s.need * 100) + '%' : '0%',
      zero: s.need === 0,
      needUp: () => this.setState({ need: s.need + 1 }),
      needDown: () => this.setState({ need: Math.max(0, s.need - 1), packed: Math.min(s.packed, Math.max(0, s.need - 1)) }),
      packUp: () => this.setState({ packed: Math.min(s.need, s.packed + 1) }),
      packDown: () => this.setState({ packed: Math.max(0, s.packed - 1) }),
      statuses, bags, whos,
      toggleMic: () => this.setState({ mic: !s.mic }),
      micPressed: s.mic ? 'true' : 'false',
      micAria: s.mic ? 'Stop listening' : 'Say the note instead of typing',
      micBg: s.mic ? '#0E2A23' : '#EEF1EA',
      micInk: s.mic ? '#EEF1EA' : '#0E2A23'
    };
  }
}
</script>
</body>
</html>
