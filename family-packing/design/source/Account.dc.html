<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="Trips.dc.html" aria-label="Back to trips" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font: 500 11px 'DM Mono', monospace; letter-spacing: 0.1em; color: #56665F">ACCOUNT</span>
<span style="width: 44px; height: 44px"></span>
</header>

<div style="flex: none; display: flex; align-items: center; gap: 14px; padding: 0 4px">
<span style="width: 60px; height: 60px; flex: none; border-radius: 50%; background: #3A6BFF; color: #FFFFFF; display: grid; place-items: center; font-size: 24px; font-weight: 850">N</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 44px; line-height: 0.9; font-weight: 900; font-stretch: 64%">Nadia</h1>
<span style="font-size: 13px; color: #56665F">nadia@example.com</span>
</div>
</div>

<section style="flex: none; background: #FFFFFF; border-radius: 20px; padding: 0 8px 0 14px; display: flex; flex-direction: column">
<a href="Share.dc.html" style="height: 56px; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 16px; font-weight: 650">Household</span><span style="font-size: 13px; color: #56665F">2 adults · 1 invited</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
<a href="Crew.dc.html" style="height: 56px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 16px; font-weight: 650">Crew and Scout's memory</span><span style="font-size: 13px; color: #56665F">4 profiles</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">HOW SCOUT PACKS FOR YOU</h2>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 16px; font-weight: 650">Temperature</span>
<div style="display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: #EEF1EA">
<sc-for list="{{units}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="width: 52px; height: 38px; border: 0; border-radius: 9px; background: {{o.bg}}; font: {{o.w}} 14px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 16px; font-weight: 650">Default packing style</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #EEF1EA">
<sc-for list="{{styles}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; border: 0; border-radius: 9px; background: {{o.bg}}; font: {{o.w}} 14px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid #EDF0EA">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 650">{{t.label}}</span><span style="font-size: 12px; line-height: 1.35; color: #56665F">{{t.sub}}</span></span>
<button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="width: 56px; height: 44px; flex: none; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><span style="width: 52px; height: 30px; border-radius: 15px; background: {{t.track}}; display: block; position: relative"><span style="position: absolute; top: 3px; left: {{t.left}}; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: left 0.15s ease"></span></span></button>
</div>
</sc-for>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 20px; padding: 0 8px 0 14px; display: flex; flex-direction: column">
<button type="button" style="height: 56px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; text-align: left; font: 650 16px Archivo, system-ui, sans-serif; color: #0E2A23; cursor: pointer">Export my lists and data</button>
<button type="button" style="height: 56px; padding: 0; border: 0; border-top: 1px solid #EDF0EA; background: transparent; display: flex; align-items: center; text-align: left; font: 650 16px Archivo, system-ui, sans-serif; color: #B23A0B; cursor: pointer">Delete my account and data</button>
</section>

<a href="Main.dc.html" style="flex: none; margin-top: auto; height: 52px; border-radius: 16px; border: 1.5px solid #0E2A23; display: grid; place-items: center; font-size: 16px; font-weight: 700">Sign out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'F', style: 'Balanced', remember: true, joins: true };
  }
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', w: on ? '750' : '550', pressed: on ? 'true' : 'false' });
    const tog = (key, label, sub) => ({ label, sub, checked: s[key] ? 'true' : 'false', track: s[key] ? '#0E2A23' : '#8A9892', left: s[key] ? '25px' : '3px', toggle: () => this.setState({ [key]: !s[key] }) });
    return {
      units: [['F', '°F'], ['C', '°C']].map((u) => ({ label: u[1], ...seg(s.unit === u[0]), pick: () => this.setState({ unit: u[0] }) })),
      styles: ['Light', 'Balanced', 'Ready'].map((v) => ({ label: v, ...seg(s.style === v), pick: () => this.setState({ style: v }) })),
      toggles: [
        tog('remember', 'Let Scout suggest things to remember', 'It always asks first. Nothing is saved without your OK.'),
        tog('joins', 'Email me when someone joins', 'Only when a new grown-up accepts an invite.')
      ]
    };
  }
}
</script>
</body>
</html>
