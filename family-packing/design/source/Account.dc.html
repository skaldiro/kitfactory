<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<header style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="Trips.dc.html" aria-label="Back to trips" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Account</span>
<span style="width: 44px; height: 44px"></span>
</header>

<div style="flex: none; display: flex; align-items: center; gap: 14px; padding: 0 4px">
<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><circle cx="28" cy="28" r="26.75" fill="none" stroke="#2D55D6" stroke-width="2.5"></circle><circle cx="28" cy="28" r="21.5" fill="#AFC6FF"></circle><text x="28" y="35" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0E2A23">N</text></svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 40px; line-height: 0.9; font-weight: 900; font-stretch: 62.5%">Nadia</h1>
<span style="font-size: 14px; color: #56665F">nadia@example.com</span>
</div>
</div>

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 0 8px 0 16px; display: flex; flex-direction: column">
<a href="Share.dc.html" style="height: 56px; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 16px; font-weight: 600">Household</span><span style="font-size: 14px; color: #56665F">2 adults · 1 invited</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="Crew.dc.html" style="height: 56px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 16px; font-weight: 600">Crew and what Scout remembers</span><span style="font-size: 14px; color: #56665F">4</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">How Scout packs for you</h2>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 16px; font-weight: 600">Temperature</span>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #EEF1EA">
<sc-for list="{{units}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="width: 52px; height: 40px; border: 0; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}; font: 600 14px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 16px; font-weight: 600">Default packing style</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #EEF1EA">
<sc-for list="{{styles}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; border: 0; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}; font: 600 14px Archivo, system-ui, sans-serif; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid #EDF0EA">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{t.label}}</span><span style="font-size: 12px; line-height: 1.35; color: #56665F">{{t.sub}}</span></span>
<button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="width: 56px; height: 44px; flex: none; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer"><span style="width: 52px; height: 32px; border-radius: 999px; background: {{t.track}}; display: block; position: relative"><span style="position: absolute; top: 4px; left: {{t.left}}; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: left 0.15s ease"></span></span></button>
</div>
</sc-for>
</section>

<section style="flex: none; background: #FFFFFF; border-radius: 22px; padding: 0 8px 0 16px; display: flex; flex-direction: column">
<a href="Privacy.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 10px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Your data and privacy</span><span style="font-size: 12px; color: #56665F">Never sold, never used for ads or AI training</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="Confirm.dc.html" style="height: 56px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; font-size: 16px; font-weight: 600">Leave household</a>
<a href="Confirm.dc.html" style="height: 56px; border-top: 1px solid #EDF0EA; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: #B42318">Delete my account and data</a>
</section>

<a href="Confirm.dc.html" style="flex: none; margin-top: auto; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #7D8B85; background: #FFFFFF; display: grid; place-items: center; font-size: 16px; font-weight: 700">Sign out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'F', style: 'Balanced', remember: true, joins: true };
  }
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ bg: on ? '#0E2A23' : 'transparent', fg: on ? '#EEF1EA' : '#0E2A23', pressed: on ? 'true' : 'false' });
    const tog = (key, label, sub) => ({ label, sub, checked: s[key] ? 'true' : 'false', track: s[key] ? '#0E2A23' : '#7D8B85', left: s[key] ? '24px' : '4px', toggle: () => this.setState({ [key]: !s[key] }) });
    return {
      units: [['F', '°F'], ['C', '°C']].map((u) => ({ label: u[1], ...seg(s.unit === u[0]), pick: () => this.setState({ unit: u[0] }) })),
      styles: ['Light', 'Balanced', 'Ready'].map((v) => ({ label: v, ...seg(s.style === v), pick: () => this.setState({ style: v }) })),
      toggles: [
        tog('remember', 'Let Scout suggest things to remember', 'It always asks first.'),
        tog('joins', 'Email me when someone joins', 'Only when someone accepts an invite.')
      ]
    };
  }
}
</script>
</body>
</html>
