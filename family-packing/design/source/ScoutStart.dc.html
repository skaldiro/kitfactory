<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitmunk · Ask Scout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#56665F}
.kb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 12px; display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF"></span><span style="font-size: 28px; font-weight: 900; font-stretch: 62.5%">Italy</span></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Scout" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; overflow: hidden; display: flex; flex-direction: column">
<header style="flex: none; height: 48px; margin: 14px 14px 0 18px; display: flex; align-items: center; gap: 12px">
<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"></rect><circle cx="12" cy="12" r="2.6" fill="#0E2A23"></circle></svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; line-height: 1; font-weight: 700">Scout</span>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">Editing the Italy list</span>
</div>
<a href="Pack.dc.html" aria-label="Close Scout" style="width: 44px; height: 44px; border-radius: 999px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 18px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="flex: none">
<h1 style="margin: 0; font-size: 40px; line-height: 0.95; font-weight: 900; font-stretch: 62.5%">What changed?</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.45; color: #56665F">Type it or say it. You'll see every change before anything moves.</p>
</div>

<span style="flex: none; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F">People often say</span>
<div style="flex: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="5">
<a href="Scout.dc.html" style="min-height: 52px; box-sizing: border-box; border: 1.5px solid #7D8B85; border-radius: 14px; padding: 8px 12px 8px 16px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 16px; font-weight: 500; line-height: 1.3">{{i}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</div>

<form style="flex: none; margin: 0; padding: 12px 16px 22px; border-top: 1px solid #EDF0EA; display: flex; gap: 8px">
<label for="askScout" class="kb-sr">Message Scout</label>
<div style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #7D8B85; padding: 0 4px 0 18px; display: flex; align-items: center; gap: 4px">
<input id="askScout" value="{{text}}" onChange="{{onText}}" placeholder="Tell Scout what changed" style="flex: 1; min-width: 0; border: 0; padding: 0; outline: none; background: transparent; font: 500 16px Archivo, system-ui, sans-serif; color: #0E2A23">
<a href="VoiceRecord.dc.html" aria-label="Talk instead of typing" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
</div>
<a href="Scout.dc.html" aria-label="Send to Scout" style="width: 56px; height: 56px; flex: none; border-radius: 999px; background: #FF5B23; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></a>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: '' };
  }
  renderVals() {
    return {
      ideas: ["We're adding a two-day hike near Cinque Terre", 'What did we forget?', 'Make it carry-on only', "It's going to be colder than we planned", 'A friend is joining us'],
      text: this.state.text,
      onText: (e) => this.setState({ text: e.target.value })
    };
  }
}
</script>
</body>
</html>
