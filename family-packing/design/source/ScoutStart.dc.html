<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Ask Scout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
input::placeholder{color:#7D8B85}
.kb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes kbBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 12px; display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="font-size: 30px; font-weight: 900; font-stretch: 64%">Italy</span></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Scout" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; overflow: hidden; display: flex; flex-direction: column">
<header style="flex: none; height: 48px; margin: 14px 14px 0 18px; display: flex; align-items: center; gap: 12px">
<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.6" fill="#0E2A23"/></svg>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 22px; line-height: 1; font-weight: 900; font-stretch: 66%">Scout</span>
<span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">EDITING · ITALY LIST</span>
</div>
<a href="Pack.dc.html" aria-label="Close Scout" style="width: 44px; height: 44px; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 22px 18px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="flex: none">
<h1 style="margin: 0; font-size: 52px; line-height: 0.9; font-weight: 900; font-stretch: 64%; letter-spacing: -0.01em">What changed?</h1>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: #56665F">Tell me in plain words, typed or spoken. I'll show you every change before anything moves.</p>
</div>

<span style="flex: none; margin-top: 4px; font: 500 11px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">PEOPLE OFTEN SAY</span>
<div style="flex: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="5">
<a href="Scout.dc.html" style="min-height: 52px; box-sizing: border-box; border: 1.5px solid #E3E8E0; border-radius: 16px; padding: 8px 12px 8px 14px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 15px; font-weight: 650; line-height: 1.3">{{i}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56665F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</a>
</sc-for>
</div>

<sc-if value="{{listening}}" hint-placeholder-val="{{ false }}">
<div aria-live="polite" style="flex: none; margin-top: auto; height: 96px; border-radius: 20px; background: #0E2A23; color: #EEF1EA; display: flex; align-items: center; justify-content: center; gap: 6px">
<span style="width: 5px; height: 40px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out infinite"></span>
<span style="width: 5px; height: 40px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.15s infinite"></span>
<span style="width: 5px; height: 40px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.3s infinite"></span>
<span style="width: 5px; height: 40px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.45s infinite"></span>
<span style="width: 5px; height: 40px; border-radius: 3px; background: #FF5B23; animation: kbBar 0.9s ease-in-out 0.6s infinite"></span>
<span style="margin-left: 12px; font-size: 16px; font-weight: 650">Listening. Tap the mic when you're done.</span>
</div>
</sc-if>
</div>

<form style="flex: none; margin: 0; padding: 12px 16px 20px; border-top: 1px solid #EDF0EA; display: flex; gap: 8px">
<label for="askScout" class="kb-sr">Message Scout</label>
<input id="askScout" value="{{text}}" onChange="{{onText}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 50px; box-sizing: border-box; border-radius: 25px; border: 1.5px solid #D9DFD6; background: #EEF1EA; padding: 0 18px; font: 500 15px Archivo, system-ui, sans-serif; color: #0E2A23; outline: none">
<button type="button" onClick="{{toggleMic}}" aria-pressed="{{micPressed}}" aria-label="{{micAria}}" style="width: 50px; height: 50px; flex: none; border: 0; border-radius: 25px; background: {{micBg}}; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{micInk}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<a href="Scout.dc.html" aria-label="Send" style="width: 50px; height: 50px; flex: none; border-radius: 25px; background: #FF5B23; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></a>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: '', mic: false };
  }
  renderVals() {
    const s = this.state;
    return {
      ideas: ["We're adding a two-day hike near Cinque Terre", 'What did we forget?', 'Make it carry-on only', "It's going to be colder than we planned", "Leo's friend is coming too"],
      text: s.text,
      onText: (e) => this.setState({ text: e.target.value }),
      placeholder: s.mic ? 'Listening…' : 'Tell Scout what changed…',
      listening: s.mic,
      toggleMic: () => this.setState({ mic: !s.mic }),
      micPressed: s.mic ? 'true' : 'false',
      micAria: s.mic ? 'Stop listening' : 'Talk instead of typing',
      micBg: s.mic ? '#0E2A23' : '#EEF1EA',
      micInk: s.mic ? '#EEF1EA' : '#0E2A23'
    };
  }
}
</script>
</body>
</html>
