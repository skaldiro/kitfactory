<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitbag · Pick dates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#EEF1EA}
a{color:#0E2A23;text-decoration:none}
a:hover{color:#0E2A23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1EA; color: #0E2A23; font-family: Archivo, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span></div>
<span style="font-size: 40px; line-height: 0.95; font-weight: 850; font-stretch: 68%">Tell me about your trip</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14, 42, 35, 0.55)"></div>

<section aria-label="Pick your dates" style="position: absolute; left: 0; right: 0; top: 130px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9DFD6"></span>

<div style="display: flex; align-items: center; gap: 12px">
<h1 style="flex: 1; margin: 0; font-size: 34px; line-height: 1; font-weight: 900; font-stretch: 66%">When are you going?</h1>
<a href="Describe.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="height: 58px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{startBd}}; padding: 0 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px"><span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">LEAVE</span><span style="font-size: 16px; font-weight: 700">{{startLabel}}</span></div>
<div style="height: 58px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{endBd}}; padding: 0 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px"><span style="font: 500 10px 'DM Mono', monospace; letter-spacing: 0.08em; color: #56665F">BACK</span><span style="font-size: 16px; font-weight: 700">{{endLabel}}</span></div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{prev}}" aria-label="Previous month" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{prevInk}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 aria-live="polite" style="flex: 1; margin: 0; text-align: center; font-size: 22px; font-weight: 850; font-stretch: 72%">{{monthLabel}}</h2>
<button type="button" onClick="{{next}}" aria-label="Next month" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EEF1EA; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E2A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font: 500 11px 'DM Mono', monospace; color: #56665F; text-align: center">
<span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<div style="height: 44px; background: {{c.band}}; border-radius: {{c.bandR}}">
<sc-if value="{{c.day}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0; border: {{c.bd}}; border-radius: 12px; background: {{c.bg}}; color: {{c.fg}}; font: {{c.w}} 16px Archivo, system-ui, sans-serif; cursor: pointer">{{c.label}}</button>
</sc-if>
</div>
</sc-for>
</div>

<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: #56665F"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="5" y="5" width="14" height="14" rx="3.5" transform="rotate(45 12 12)" fill="#FF5B23"/><circle cx="12" cy="12" r="2.6" fill="#0E2A23"/></svg><span>{{note}}</span></p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
<a href="Describe.dc.html" style="height: 58px; border-radius: 18px; background: {{ctaBg}}; color: {{ctaFg}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 750">{{cta}}</a>
<a href="Describe.dc.html" style="height: 44px; display: grid; place-items: center; font-size: 14px; font-weight: 650; text-decoration: underline; text-underline-offset: 3px">No dates yet, just how long</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const KB_MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const KB_DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const KB_TODAY = 20261111;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { y: 2026, m: 10, a: { y: 2026, m: 10, d: 20 }, b: { y: 2026, m: 10, d: 29 } };
  }
  renderVals() {
    const s = this.state;
    const key = (o) => (o ? o.y * 10000 + (o.m + 1) * 100 + o.d : 0);
    const ka = key(s.a), kb = key(s.b);
    const fmt = (o) => (o ? KB_DOW[new Date(o.y, o.m, o.d).getDay()] + ', ' + KB_MON[o.m].slice(0, 3) + ' ' + o.d : 'Pick a day');
    const lead = new Date(s.y, s.m, 1).getDay();
    const count = new Date(s.y, s.m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push({ day: false, band: 'transparent', bandR: '0' });
    for (let d = 1; d <= count; d++) {
      const o = { y: s.y, m: s.m, d };
      const k = key(o);
      const past = k < KB_TODAY;
      const isA = k === ka, isB = k === kb;
      const edge = isA || isB;
      const ranged = kb && ka !== kb;
      cells.push({
        day: true, label: d,
        band: ranged && k >= ka && k <= kb ? '#E2E8DF' : 'transparent',
        bandR: isA ? '12px 0 0 12px' : (isB ? '0 12px 12px 0' : '0'),
        bg: edge ? '#0E2A23' : 'transparent',
        fg: edge ? '#EEF1EA' : (past ? '#8A9892' : '#0E2A23'),
        bd: k === KB_TODAY && !edge ? '1.5px solid #FF5B23' : '0',
        w: edge ? '800' : '600',
        pressed: edge ? 'true' : 'false',
        aria: fmt(o) + (isA ? ', leaving' : '') + (isB ? ', coming back' : '') + (past ? ', in the past' : ''),
        pick: () => {
          if (past) return;
          if (!s.a || s.b || k < ka) this.setState({ a: o, b: null });
          else this.setState({ b: o });
        }
      });
    }
    const both = s.a && s.b;
    const n = both ? Math.round((new Date(s.b.y, s.b.m, s.b.d) - new Date(s.a.y, s.a.m, s.a.d)) / 86400000) + 1 : 0;
    const atStart = s.y === 2026 && s.m === 10;
    return {
      cells,
      monthLabel: KB_MON[s.m] + ' ' + s.y,
      startLabel: fmt(s.a), endLabel: s.b ? fmt(s.b) : 'Pick a day',
      startBd: s.a && !s.b ? '#E3E8E0' : (s.a ? '#E3E8E0' : '#0E2A23'),
      endBd: s.a && !s.b ? '#0E2A23' : '#E3E8E0',
      prev: () => { if (atStart) return; const m = s.m === 0 ? 11 : s.m - 1; this.setState({ m, y: s.m === 0 ? s.y - 1 : s.y }); },
      next: () => { const m = s.m === 11 ? 0 : s.m + 1; this.setState({ m, y: s.m === 11 ? s.y + 1 : s.y }); },
      prevInk: atStart ? '#B7C2BB' : '#0E2A23',
      note: both ? n + (n === 1 ? ' day' : ' days') + ', ' + (n - 1) + (n === 2 ? ' night' : ' nights') + ". I'll check the usual weather for each stop on these dates." : 'Now tap the day you come back.',
      cta: both ? 'Set dates · ' + n + (n === 1 ? ' day' : ' days') : 'Pick your return day',
      ctaBg: both ? '#0E2A23' : '#E2E8DF',
      ctaFg: both ? '#EEF1EA' : '#56665F'
    };
  }
}
</script>
</body>
</html>
